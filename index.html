<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PP FG WH - SYSTEM</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- PUSTAKA TESSERACT.JS UNTUK OCR CAMERA -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; background-color: #f4f5f7; margin: 0; padding: 0; font-size: 15px; color: #333;} 
        .app-header { background-color: #1c1c1c; display: flex; justify-content: center; align-items: center; padding: 12px 15px; border-bottom: 1px solid #333; position: relative;}
        .app-header img { height: 28px; object-fit: contain; }
        .btn-logout { position: absolute; right: 15px; background: transparent; border: 1px solid #555; color: #ccc; border-radius: 4px; padding: 4px 8px; font-size: 11px; font-weight: bold; cursor: pointer;}
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1c1c1c 0%, #3a3a3a 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 40px 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 85%; max-width: 320px;}
        .login-box h2 { color: #1c1c1c; margin: 0 0 5px 0; font-weight: 900; font-size: 22px;}
        .btn-google { background: white; border: 1px solid #ddd; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; margin-top: 20px;}
        .btn-google img { height: 22px; }

        .tab-bar { display: flex; background: #1c1c1c; color: white; padding: 0 5px; position: sticky; top: 0; z-index: 20; overflow-x: auto;}
        .tab-btn { flex: 1; min-width: 80px; padding: 15px 5px; text-align: center; font-weight: bold; font-size: 12px; color: #888; border-bottom: 4px solid transparent; cursor: pointer; text-transform: uppercase;}
        .tab-btn.active { color: white; border-bottom: 4px solid #cc0000; } 
        
        .content { padding: 12px; display: none; }
        .content.active { display: block; }
        
        .sticky-filter { position: sticky; top: 52px; background: #f4f5f7; padding: 12px; z-index: 10; margin: -12px -12px 0 -12px;}
        input.search-box { padding: 14px; width: 100%; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; font-weight: bold; text-align: center; text-transform: uppercase; outline: none;} 
        
        .form-card { background: white; padding: 18px; border-radius: 10px; border: 1px solid #e0e0e0; margin-bottom: 15px;}
        .form-row { display: flex; gap: 12px; margin-bottom: 15px; }
        .form-row > * { flex: 1; }
        input.form-input, select.form-select, textarea.form-textarea { padding: 14px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; outline: none;} 
        input.form-input { text-transform: uppercase;}
        
        .btn-add { background-color: #cc0000; color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; margin-top:10px;}
        .btn-sync { background-color: #f39c12; color: #fff; padding: 14px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 15px;}
        .btn-scan-ocr { display: block; background-color: #555; color: white; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; cursor: pointer; margin-bottom: 15px; border: 2px dashed #333;}
        
        .grouped-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px;}
        .mini-card { background: white; border-radius: 8px; padding: 12px; border-top: 5px solid #cc0000; border-left: 1px solid #eee; border-right: 1px solid #eee; border-bottom: 1px solid #eee;}
        .mini-card.stok-card { border-top: 5px solid #f39c12; }
        
        .card-header-modern { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px;}
        .badge-so-modern { flex: 1; background: #1c1c1c; color: white; padding: 8px 4px; border-radius: 6px; font-weight: bold; font-size: 13px; text-align: center;}
        .badge-size-modern { flex: 0.6; background: #cc0000; color: white; padding: 8px 4px; border-radius: 6px; font-weight: 900; font-size: 14px; text-align: center;}
        .badge-size-stok { background: #f39c12; }
        
        .info-box { background: #f8f9fa; border: 1px solid #eee; padding: 8px 4px; border-radius: 6px; text-align: center; }
        .info-label { display: block; font-size: 10px; color: #888; margin-bottom: 2px; font-weight: bold;}
        .info-value { display: block; font-size: 13px; font-weight: 900; color: #1c1c1c; }
        .action-row { display: flex; gap: 8px; margin-top: 15px; }
        .action-row button { flex: 1; padding: 10px 0; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 12px;}
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-box">
            <h2>PP FG WH SYSTEM</h2>
            <button class="btn-google" id="btnGoogleLogin">Masuk dengan Google</button>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="app-header">
            <h3 style="color:white; margin:0;">FG & SI MONITORING</h3>
            <button class="btn-logout" id="btnLogout">LOGOUT</button>
        </div>

        <div class="tab-bar">
            <div id="btnTabStokFG" class="tab-btn active" onclick="openTab('tabStokFG', this)">📦 STOK FG</div>
            <div id="btnTabInputSI" class="tab-btn" onclick="openTab('tabInputSI', this)">➕ INPUT SI</div>
            <div id="btnTabAktifSI" class="tab-btn" onclick="openTab('tabAktifSI', this)">🟢 SI AKTIF</div>
            <div id="btnTabRiwayat" class="tab-btn" onclick="openTab('tabRiwayat', this)">🔴 RIWAYAT</div>
        </div>

        <!-- TAB 1: PANTUAN STOK DARI SPREADSHEET -->
        <div id="tabStokFG" class="content active">
            <div class="sticky-filter">
                <input type="text" id="filterStokSheet" class="search-box" placeholder="🔍 Cari SO / Artikel di FG">
            </div>
            <button class="btn-sync" onclick="tarikDataSpreadsheet()">🔄 SINKRONKAN DARI EXCEL FG</button>
            <p id="statusSpreadsheet" style="text-align:center; font-size:12px; font-weight:bold;"></p>
            <div id="gridStokSpreadsheet" class="grouped-grid"></div>
        </div>

        <!-- TAB 2: INPUT SI DENGAN AUTO-FILL -->
        <div id="tabInputSI" class="content">
            <div class="form-card">
                <h3 style="margin-top: 0; text-align: center; margin-bottom: 15px;">📝 FORM EQL KILAT</h3>
                
                <label for="ocrInput" class="btn-scan-ocr">📷 SCAN KERTAS EQL (OCR)</label>
                <input type="file" id="ocrInput" accept="image/*" capture="environment" style="display: none;">
                
                <div class="form-row">
                    <input type="date" id="tanggalInput" class="form-input">
                    <input type="text" id="soInput" class="form-input" placeholder="SO (LO9089)">
                </div>
                <div class="form-row">
                    <input type="text" id="artikelInput" class="form-input" placeholder="Artikel / Style">
                    <input type="text" id="lokasiInput" class="form-input" placeholder="Lokasi (SI-A)">
                </div>

                <div style="background: #f9f9f9; padding: 12px; border: 1px dashed #ccc; border-radius: 8px;">
                    <p style="color:#cc0000; font-weight:bold; font-size:12px; margin-top:0;">*Ketik No. Karton, SO & Size terisi otomatis!</p>
                    <div id="kartonList">
                        <div class="form-row karton-item" style="margin-bottom: 10px;">
                            <input type="text" class="form-input size-input" placeholder="Size (8T)">
                            <input type="text" inputmode="numeric" class="form-input nokarton-input" placeholder="Karton (#123)">
                        </div>
                    </div>
                    <button onclick="tambahBaris()" style="width:100%; padding:10px; background:#555; color:white; font-weight:bold; border:none; border-radius:6px;">➕ TAMBAH KARTON</button>
                </div>
                
                <button class="btn-add" id="btnSimpanSI">SUBMIT KE SI</button>
                <button onclick="resetFormTotal()" style="width:100%; padding:10px; background:#888; color:white; font-weight:bold; border:none; border-radius:6px; margin-top:10px;">🔄 KOSONGKAN FORM</button>
            </div>
        </div>

        <!-- TAB 3: DATA SI AKTIF -->
        <div id="tabAktifSI" class="content">
            <div class="sticky-filter">
                <input type="text" id="filterSIAktif" class="search-box" placeholder="🔍 Cari SO di SI">
            </div>
            <div id="gridSIAktif" class="grouped-grid"></div>
        </div>

        <!-- TAB 4: RIWAYAT OUT -->
        <div id="tabRiwayat" class="content">
            <div class="sticky-filter">
                <input type="text" id="filterRiwayat" class="search-box" placeholder="🔍 Cari SO di Riwayat">
            </div>
            <div id="gridRiwayat" class="grouped-grid"></div>
        </div>

    </div>

    <!-- FIREBASE SDK & LOGIKA SISTEM -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        // Konfigurasi Database Realtime Lo
        const firebaseConfig = {
            apiKey: "AIzaSyDSaLtB4b2XyuisVAJ-Djf1RQDtXyOy5_U",
            authDomain: "bizsight-33tbg.firebaseapp.com",
            databaseURL: "https://bizsight-33tbg-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bizsight-33tbg",
            storageBucket: "bizsight-33tbg.firebasestorage.app",
            messagingSenderId: "333910528874",
            appId: "1:333910528874:web:c6632d3517a157a3584b13"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const kartonRef = ref(db, 'stok_fg_wh');
        const auth = getAuth(app);

        let dataStokExcel = []; // Penampung Data dari Apps Script
        let dataFirebase = [];  // Penampung Data dari Firebase

        // ==========================================
        // 1. LINK GOOGLE APPS SCRIPT LO DI SINI 👇
        // ==========================================
        const URL_GAS_LO = "https://script.google.com/macros/s/AKfycbwpO1hGzzC76szS5xgc5gfHW-jdtw3Cz5BXMmKbd3KZusgCvunA-p1c6YgmK9GjN4gp/exec"; 

        // AUTHENTICATION
        onAuthStateChanged(auth, (user) => {
            document.getElementById('loginScreen').style.display = user ? "none" : "flex";
            document.getElementById('mainApp').style.display = user ? "block" : "none";
        });
        document.getElementById('btnGoogleLogin').addEventListener('click', () => signInWithPopup(auth, new GoogleAuthProvider()));
        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        // TAB NAVIGATION
        window.openTab = (tabName, elmnt) => {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            elmnt.classList.add('active');
        };

        // ==========================================
        // FITUR SINKRONISASI STOK EXCEL (APPS SCRIPT)
        // ==========================================
        window.tarikDataSpreadsheet = async () => {
            const statusDiv = document.getElementById('statusSpreadsheet');
            statusDiv.style.color = '#f39c12';
            statusDiv.innerText = '⏳ Menyedot data dari file Excel FG...';
            
            try {
                const response = await fetch(URL_GAS_LO);
                const data = await response.json();
                dataStokExcel = data; // Simpan ke otak aplikasi
                
                statusDiv.style.color = 'green';
                statusDiv.innerText = `✅ Berhasil narik ${data.length} karton siap kirim!`;
                renderStokExcel();
            } catch (error) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = '❌ Gagal terhubung. Cek URL Apps Script!';
            }
        };

        function renderStokExcel() {
            const grid = document.getElementById('gridStokSpreadsheet');
            const filterText = document.getElementById('filterStokSheet').value.toUpperCase();
            grid.innerHTML = '';

            let filteredData = dataStokExcel.filter(d => (d.so || "").toUpperCase().includes(filterText) || (d.artikel || "").toUpperCase().includes(filterText));
            
            filteredData.forEach(data => {
                grid.innerHTML += `
                    <div class="mini-card stok-card">
                        <div class="card-header-modern">
                            <div class="badge-so-modern">${data.so}</div>
                            <div class="badge-size-modern badge-size-stok">${data.size}</div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <div class="info-box"><span class="info-label">Karton</span><span class="info-value">${data.karton}</span></div>
                            <div class="info-box"><span class="info-label">Artikel</span><span class="info-value" style="font-size:11px;">${data.artikel}</span></div>
                        </div>
                    </div>
                `;
            });
        }
        document.getElementById('filterStokSheet').addEventListener('input', renderStokExcel);

        // ==========================================
        // AUTO-FILL LOGIC & INPUT SI
        // ==========================================
        document.getElementById('tanggalInput').valueAsDate = new Date();

        function terapkanEventInput() {
            document.querySelectorAll('.nokarton-input').forEach(input => {
                input.addEventListener('blur', function() {
                    let val = this.value.toUpperCase().trim();
                    if(val !== '' && !val.startsWith('#')) val = '#' + val;
                    this.value = val;
                    
                    // Ajaibnya di Sini: Nengok ke Data Excel
                    if(val && dataStokExcel.length > 0) {
                        let match = dataStokExcel.find(m => m.karton === val);
                        if(match) {
                            let row = this.closest('.karton-item');
                            row.querySelector('.size-input').value = match.size; // Isi Size
                            
                            // Isi SO & Artikel di form atas kalau masih kosong
                            if(!document.getElementById('soInput').value) document.getElementById('soInput').value = match.so;
                            if(!document.getElementById('artikelInput').value) document.getElementById('artikelInput').value = match.artikel;
                        }
                    }
                });
            });
        }
        terapkanEventInput();

        window.tambahBaris = () => {
            const list = document.getElementById('kartonList');
            const row = document.createElement('div');
            row.className = 'form-row karton-item';
            row.style.marginBottom = '10px';
            row.innerHTML = `<input type="text" class="form-input size-input" placeholder="Size"><input type="text" inputmode="numeric" class="form-input nokarton-input" placeholder="Karton">`;
            list.appendChild(row);
            terapkanEventInput();
        };

        window.resetFormTotal = () => {
            document.getElementById('soInput').value = '';
            document.getElementById('artikelInput').value = '';
            document.getElementById('lokasiInput').value = '';
            document.getElementById('kartonList').innerHTML = `<div class="form-row karton-item" style="margin-bottom: 10px;"><input type="text" class="form-input size-input" placeholder="Size (8T)"><input type="text" inputmode="numeric" class="form-input nokarton-input" placeholder="Karton (#123)"></div>`;
            terapkanEventInput();
        };

        document.getElementById('btnSimpanSI').addEventListener('click', async () => {
            const val = (id) => document.getElementById(id).value.toUpperCase().trim();
            const so = val('soInput'); const artikel = val('artikelInput'); const lokasi = val('lokasiInput');
            if(!so) return alert("SO wajib diisi!");

            const kartonItems = document.querySelectorAll('.karton-item');
            let dataToPush = [];
            
            kartonItems.forEach(item => {
                let sizeInput = item.querySelector('.size-input').value.toUpperCase().trim();
                let noKartonInput = item.querySelector('.nokarton-input').value.toUpperCase().trim();
                if(sizeInput && noKartonInput) dataToPush.push({ size: sizeInput, noKarton: noKartonInput });
            });

            if(dataToPush.length === 0) return alert("Minimal isi 1 pasang Size & Karton!");

            for(let k of dataToPush) {
                await set(push(kartonRef), { 
                    so_number: so, artikel: artikel, lokasi: lokasi, 
                    size: k.size, nomor_karton: k.noKarton, status: "AKTIF", status_repack: "WIP"
                });
            }
            alert("Data sukses dilesatkan ke SI!");
            document.getElementById('kartonList').innerHTML = `<div class="form-row karton-item" style="margin-bottom: 10px;"><input type="text" class="form-input size-input" placeholder="Size (8T)"><input type="text" inputmode="numeric" class="form-input nokarton-input" placeholder="Karton (#123)"></div>`;
            terapkanEventInput();
        });

        // ==========================================
        // FITUR FIREBASE (SI AKTIF & RIWAYAT)
        // ==========================================
        onValue(kartonRef, (snapshot) => {
            dataFirebase = [];
            snapshot.forEach((child) => {
                let d = child.val(); d.id = child.key;
                dataFirebase.push(d);
            });
            renderDataFirebase();
        });

        window.ubahStatusRepack = async (id, statusBaru) => {
            await update(ref(db, `stok_fg_wh/${id}`), { status_repack: statusBaru });
        };
        
        window.keluarkanBarang = async (id) => {
            if(confirm("Yakin barang udah beres inspeksi & mau dikembalikan ke FG?")) {
                await update(ref(db, `stok_fg_wh/${id}`), { status: "OUT" });
            }
        };

        function renderDataFirebase() {
            const gridAktif = document.getElementById('gridSIAktif');
            const gridRiwayat = document.getElementById('gridRiwayat');
            const filterA = document.getElementById('filterSIAktif').value.toUpperCase();
            const filterR = document.getElementById('filterRiwayat').value.toUpperCase();
            
            gridAktif.innerHTML = ''; gridRiwayat.innerHTML = '';

            dataFirebase.forEach(data => {
                let htmlCard = `
                    <div class="mini-card ${data.status_repack === 'DONE' ? 'stok-card' : ''}">
                        <div class="card-header-modern">
                            <div class="badge-so-modern">${data.so_number}</div>
                            <div class="badge-size-modern ${data.status_repack === 'DONE' ? 'badge-size-stok' : ''}">${data.size}</div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <div class="info-box"><span class="info-label">Karton</span><span class="info-value">${data.nomor_karton}</span></div>
                            <div class="info-box"><span class="info-label">Lokasi</span><span class="info-value" style="color:#cc0000;">${data.lokasi}</span></div>
                        </div>
                `;

                if (data.status === "AKTIF" && (data.so_number||"").toUpperCase().includes(filterA)) {
                    let btnRepack = data.status_repack === 'DONE' 
                        ? `<button style="background:#27ae60; color:white; width:100%; border:none; padding:8px; border-radius:4px; font-weight:bold; margin-top:10px;" onclick="ubahStatusRepack('${data.id}', 'WIP')">✅ BERES (4 OK)</button>`
                        : `<button style="background:#f39c12; color:white; width:100%; border:none; padding:8px; border-radius:4px; font-weight:bold; margin-top:10px;" onclick="ubahStatusRepack('${data.id}', 'DONE')">⏳ PROSES</button>`;
                    
                    gridAktif.innerHTML += htmlCard + btnRepack + `<button style="background:#1c1c1c; color:white; width:100%; border:none; padding:8px; border-radius:4px; font-weight:bold; margin-top:5px;" onclick="keluarkanBarang('${data.id}')">KEMBALIKAN KE FG</button></div>`;
                } 
                else if (data.status === "OUT" && (data.so_number||"").toUpperCase().includes(filterR)) {
                    gridRiwayat.innerHTML += htmlCard + `<p style="text-align:center; font-size:12px; color:#c0392b; font-weight:bold; margin-top:10px;">📤 OUT</p></div>`;
                }
            });
        }
        document.getElementById('filterSIAktif').addEventListener('input', renderDataFirebase);
        document.getElementById('filterRiwayat').addEventListener('input', renderDataFirebase);
    </script>
</body>
</html>
