<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PP FG WH - SI Monitoring</title>
    
    <link rel="icon" type="image/png" href="NBicon.png">

    <style>
        /* TEMA TERANG (LIGHT MODE) */
        :root {
            --bg-color: #f4f6f8;
            --surface: #ffffff;
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --secondary: #059669;
            --text-main: #0f172a;
            --text-muted: #64748b; 
            --border: #e2e8f0;
            --box-bg: #f1f5f9;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.05);
            --danger-bg: #fef2f2;
            --danger-text: #dc2626;
        }

        /* TEMA GELAP (DARK MODE) - DIOPTIMALKAN UNTUK KETERBACAAN */
        body.dark-mode {
            color-scheme: dark; /* Bikin Kalender bawaan HP jadi ikut gelap */
            --bg-color: #0f172a;
            --surface: #1e293b;
            --primary: #ef4444; 
            --primary-hover: #f87171;
            --secondary: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155; 
            --box-bg: #0f172a;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.4);
            --danger-bg: #450a0a;
            --danger-text: #fca5a5;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; font-size: 15px; color: var(--text-main); -webkit-font-smoothing: antialiased; padding-bottom: 100px; transition: background-color 0.3s, color 0.3s;} 
        
        /* HEADER */
        .app-header { background-color: var(--surface); display: flex; justify-content: center; align-items: center; padding: 18px 20px; box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--border); transition: 0.3s;}
        .app-header img { height: 26px; object-fit: contain; }
        body.dark-mode .app-header img { filter: drop-shadow(0px 0px 2px rgba(255,255,255,0.2)) brightness(1.2); }
        .btn-logout { position: absolute; right: 20px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 6px 12px; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s;}
        .btn-logout:active { background: var(--danger-bg); border-color: var(--danger-text); color: var(--danger-text); }
        .btn-mode { position: absolute; left: 20px; background: var(--box-bg); border: 1px solid var(--border); color: var(--text-main); border-radius: 50%; width: 34px; height: 34px; display: flex; justify-content: center; align-items: center; font-size: 14px; cursor: pointer;}

        /* LOGIN SCREEN */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: var(--surface); padding: 40px 30px; text-align: center; width: 85%; max-width: 320px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .login-box img { height: 50px; margin-bottom: 25px; }
        .login-box h2 { color: var(--text-main); margin: 0 0 8px 0; font-weight: 900; font-size: 22px;}
        .login-box p { color: var(--text-muted); font-size: 14px; margin: 0 0 35px 0;}
        .btn-google { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 14px 20px; font-size: 14px; font-weight: 800; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;}
        .btn-google img { height: 20px; margin: 0; }

        /* BOTTOM NAVIGATION */
        .tab-bar { display: flex; background: var(--surface); position: fixed; bottom: 0; left: 0; width: 100%; z-index: 40; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); border-top: 1px solid var(--border); transition: 0.3s; padding-bottom: env(safe-area-inset-bottom);}
        .tab-btn { flex: 1; padding: 12px 0; text-align: center; font-weight: 800; font-size: 10px; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;}
        .tab-btn span.icon { font-size: 18px; transition: 0.2s; opacity: 0.6;}
        .tab-btn.active { color: var(--primary); } 
        .tab-btn.active span.icon { transform: scale(1.1); opacity: 1;}
        
        .content { padding: 20px 15px; display: none; animation: fadeIn 0.3s ease; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* FORM INPUT YANG LEGA */
        .sticky-filter { position: sticky; top: 60px; background: var(--bg-color); padding: 10px 0 15px 0; z-index: 10; transition: 0.3s;}
        input.search-box { padding: 15px 20px; width: 100%; border: 1px solid var(--border); border-radius: 30px; box-sizing: border-box; font-size: 14px; font-weight: 700; background: var(--surface); color: var(--text-main); box-shadow: var(--shadow-sm); outline: none;} 
        input.search-box:focus { border-color: var(--primary); }

        .form-card { background: var(--surface); padding: 25px 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); margin-bottom: 20px; border: 1px solid var(--border);}
        .form-card h3 { font-size: 18px; font-weight: 900; color: var(--text-main); margin-top: 0; margin-bottom: 25px; display: flex; align-items: center; gap: 8px;}
        .form-row { display: flex; gap: 15px; margin-bottom: 18px; }
        .form-row > * { flex: 1; }
        input.form-input, select.form-select { padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); box-sizing: border-box; font-size: 14px; font-weight: 700; outline: none; background: var(--box-bg); color: var(--text-main);} 
        input.form-input:focus, select.form-select:focus { border-color: var(--primary); background: var(--surface); }
        
        .dynamic-box { background: var(--bg-color); border: 1px dashed var(--border); padding: 20px; border-radius: var(--radius-md); margin-bottom: 20px;}
        .dynamic-header { color: var(--text-muted); font-size: 12px; font-weight: 900; margin-bottom: 15px; text-transform: uppercase;}
        .btn-tambah-baris { background-color: var(--box-bg); color: var(--text-main); border: 1px solid var(--border); padding: 12px; border-radius: var(--radius-md); width: 100%; font-weight: 800; cursor: pointer; font-size: 13px;}
        .btn-hapus-baris { background-color: var(--danger-bg); color: var(--danger-text); border: none; border-radius: var(--radius-md); cursor: pointer; padding: 0 15px; font-weight: 900;}
        
        /* TOMBOL UTAMA */
        .btn-add { background-color: var(--primary); color: white; padding: 16px; border: none; border-radius: 30px; width: 100%; font-weight: 900; cursor: pointer; font-size: 15px; letter-spacing: 0.5px;}
        
        /* PIVOT HEADER */
        .pivot-group-header { background-color: var(--surface); color: var(--text-main); padding: 16px 20px; font-size: 14px; margin-top: 10px; margin-bottom: 15px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer; font-weight: 900;}
        .pivot-count { background-color: var(--box-bg); color: var(--text-main); padding: 4px 10px; border-radius: 8px; font-size: 12px; border: 1px solid var(--border);}
        .btn-delete-so { background: var(--danger-bg); color: var(--danger-text); border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; cursor: pointer; margin-left: 8px; }

        /* ========================================= */
        /* DESAIN KARTU SPESIFIK SESUAI GAMBAR REFERENSI */
        /* ========================================= */
        .grouped-grid { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px;}
        .grouped-grid.grid-view { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;} 
        
        .mini-card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; flex-direction: column;}
        
        .chk-select { transform: scale(1.4); margin-right: 12px; accent-color: var(--primary);}
        
        /* Box Full Width */
        .full-box { background: var(--box-bg); padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; }
        .size-text { font-weight: 900; font-size: 16px; color: var(--text-main); }
        
        /* Label Kecil & Teks Bold */
        .label-sm { font-size: 10px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .val-text { font-size: 15px; font-weight: 900; color: var(--text-main); margin-left: 6px; }
        
        /* Artikel Merah */
        .artikel-val { font-size: 16px; font-weight: 900; color: var(--primary); }
        
        /* Keterangan & Garis Putus */
        .ket-box { background: var(--box-bg); padding: 10px 15px; border-radius: 8px; font-size: 12px; color: var(--text-muted); font-style: italic; border: 1px solid var(--border); margin-bottom: 18px;}
        .dotted-divider { border-top: 1px dashed var(--border); padding-top: 15px; margin-top: auto; display: flex; justify-content: space-between; align-items: center;}
        
        /* Badge Jenis Solid/Mix */
        .badge-solid { background: var(--surface); color: var(--text-main); padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 900; border: 1px solid var(--border);}
        .badge-mix { background: #fef9c3; color: #854d0e; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 900; border: 1px solid #fde047;}

        .action-row { display: flex; gap: 10px; margin-top: 15px; }
        .action-row button { flex: 1; padding: 10px 0; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 12px; transition: 0.2s;}
        .btn-edit { background: var(--box-bg); color: var(--text-main); border: 1px solid var(--border);}
        .btn-out { background: var(--text-main); color: var(--surface); border: none;}

        /* RINGKASAN STOK */
        .summary-panel { text-align:center; padding: 25px; background: var(--surface); border: 2px solid var(--secondary); border-radius: var(--radius-lg); margin-bottom: 25px; box-shadow: var(--shadow-sm);}
        .summary-panel h2 { margin:0; font-size: 40px; color: var(--secondary); font-weight: 900;}
        .summary-panel span { font-size:11px; color:var(--text-muted); font-weight:900; letter-spacing: 1px;}
        
        /* CARD KECIL UNTUK TAB STOK & LOKASI */
        .card-grid-item { background:var(--surface); border-radius: 12px; padding: 15px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; gap: 12px;}
        .card-grid-item .so-badge { font-weight: 900; font-size: 14px; color: var(--text-main); }
        .card-grid-item .size-badge { background: var(--box-bg); padding: 4px 10px; border-radius: 6px; font-weight: 900; font-size: 13px; color: var(--text-main); border: 1px solid var(--border);}

        /* FLOATING BULK BAR */
        .bulk-action-bar { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--text-main); padding: 12px 18px; border-radius: 30px; display: none; align-items: center; gap: 15px; box-shadow: var(--shadow-md); z-index: 100;}
        .bulk-action-bar span { font-weight: 900; font-size: 13px; color: var(--bg-color); padding: 0 5px;}
        .bulk-btn { padding: 8px 16px; border-radius: 20px; font-weight: 800; cursor: pointer; font-size: 12px; border: none;}
        .bulk-btn-out { background: var(--secondary); color: white; }
        .bulk-btn-del { background: var(--primary); color: white; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <img src="logo.png" alt="Logo NB">
            <h2>Selamat Datang</h2>
            <p>Sistem SI Monitoring PP FG WH</p>
            <button class="btn-google" id="btnGoogleLogin">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                Masuk dengan Google
            </button>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        
        <div class="app-header">
            <button class="btn-mode" id="btnDarkMode">🌙</button>
            <img src="logo.png" alt="Logo">
            <button class="btn-logout" id="btnLogout">Keluar</button>
        </div>

        <!-- TAB 1: FORM INPUT -->
        <div id="tabInput" class="content active">
            
            <div style="background: var(--surface); padding: 20px; border-radius: var(--radius-lg); border: 1px dashed var(--text-muted); margin-bottom: 25px;">
                <span style="font-size: 12px; font-weight: 900; color: var(--primary); display: block; margin-bottom: 12px; letter-spacing: 0.5px;">⚡ TARIK DATA STOK OTOMATIS</span>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="soTarikExcel" class="form-input" style="flex: 2; border-radius: var(--radius-md);" placeholder="Masukkan SO...">
                    <button id="btnTarikSO" style="flex: 1; background: var(--text-main); color: var(--surface); border: none; border-radius: var(--radius-md); font-weight: 800; cursor: pointer;">SINKRON</button>
                </div>
                <div id="statusTarik" style="font-size: 12px; font-weight: 800; margin-top: 10px; color: var(--primary);"></div>
            </div>

            <div class="form-card" id="formSmart">
                <h3><span style="font-size:20px;">📝</span> Form Input AQL</h3>
                <div class="form-row">
                    <input type="date" id="tanggalInput" class="form-input">
                    <input type="text" id="soInput" class="form-input" placeholder="SO (Cth: 2026PYN)">
                </div>
                <div class="form-row">
                    <select id="jenisInput" class="form-select">
                        <option value="SOLID">📦 SOLID</option>
                        <option value="MIX">🔀 MIX</option>
                    </select>
                    <input type="text" id="artikelInput" class="form-input" placeholder="Artikel / Style">
                </div>
                <div class="form-row">
                    <input type="text" id="lokasiInput" class="form-input" placeholder="Lokasi (AR01-000)">
                    <input type="text" id="keteranganInput" class="form-input" placeholder="Keterangan (Opsional)">
                </div>

                <div class="dynamic-box">
                    <div class="dynamic-header">Detail Karton</div>
                    <div id="kartonList">
                        <div class="form-row karton-item" style="margin-bottom: 12px;">
                            <input type="text" class="form-input size-input" placeholder="Ukuran">
                            <input type="text" inputmode="numeric" class="form-input nokarton-input" placeholder="No. Karton">
                            <button class="btn-hapus-baris" onclick="hapusBaris(this)" style="display:none;">❌</button>
                        </div>
                    </div>
                    <button id="btnTambahBaris" class="btn-tambah-baris">+ Tambah Baris Baru</button>
                </div>
                
                <button class="btn-add" id="btnTambah">Simpan Data Stok</button>
                
                <div id="editActionGroup" class="form-row" style="display: none; margin-top:15px;">
                    <button class="btn-tambah-baris" onclick="batalEdit()">Batal Edit</button>
                    <button class="btn-add" style="background:var(--danger-text); width:auto;" onclick="hapusPermanen()">Hapus</button>
                </div>
            </div>
        </div>

        <!-- TAB 2: STOK AKTIF -->
        <div id="tabAktif" class="content">
            <div class="sticky-filter">
                <input type="text" id="filterSOAktif" class="search-box" placeholder="🔍 Cari SO, Artikel, atau Nama...">
            </div>
            <div id="gridKartonAktif"></div> 
        </div>

        <!-- TAB 3: RIWAYAT OUT -->
        <div id="tabRiwayat" class="content">
            <div class="sticky-filter" style="display: flex; gap: 10px;">
                <input type="date" id="filterTanggalRiwayat" class="search-box" style="flex: 1; padding: 14px; font-size: 13px;">
                <input type="text" id="filterSORiwayat" class="search-box" style="flex: 1.5; font-size: 13px;" placeholder="🔍 Cari SO / Nama...">
            </div>
            <div id="gridRiwayatOut"></div> 
        </div>

        <!-- TAB 4: LOKASI SO (BENTUK KARTU GRID) -->
        <div id="tabLokasi" class="content">
            <div class="sticky-filter">
                <input type="text" id="filterCariLokasi" class="search-box" placeholder="🔍 Masukkan SO (Cth: 10206297)...">
            </div>
            <button class="btn-add" id="btnSyncLokasi" style="margin-bottom: 20px; background: var(--text-main); color: var(--surface);">🔄 Unduh Data Lokasi Excel</button>
            <div id="statusLokasi" style="text-align:center; font-size:12px; font-weight:800; margin-bottom:20px; color:var(--text-muted);"></div>
            <div id="gridLokasi" class="grouped-grid grid-view"></div>
        </div>

        <!-- TAB 5: LIST STOK SO (BENTUK KARTU GRID) -->
        <div id="tabListStok" class="content">
            <div class="sticky-filter">
                <input type="text" id="inputCariListStok" class="search-box" placeholder="🔍 Masukkan SO (Cth: 10206297)...">
            </div>
            <button class="btn-add" id="btnCariListStok" style="margin-bottom: 20px; background: var(--text-main); color: var(--surface);">🔄 Cari Data Stok Excel</button>
            <div id="statusListStok" style="text-align:center; font-size:12px; font-weight:800; margin-bottom:20px; color:var(--text-muted);"></div>
            
            <div id="summaryStokContainer"></div>
            <div id="gridListStok" class="grouped-grid grid-view"></div>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <div class="tab-bar">
            <div id="btnTabInput" class="tab-btn active" onclick="openTab('tabInput', this)"><span class="icon">➕</span> Input</div>
            <div id="btnTabAktif" class="tab-btn" onclick="openTab('tabAktif', this)"><span class="icon">📦</span> Aktif</div>
            <div id="btnTabRiwayat" class="tab-btn" onclick="openTab('tabRiwayat', this)"><span class="icon">⏱️</span> Riwayat</div>
            <div id="btnTabLokasi" class="tab-btn" onclick="openTab('tabLokasi', this)"><span class="icon">📍</span> Lokasi</div>
            <div id="btnTabListStok" class="tab-btn" onclick="openTab('tabListStok', this)"><span class="icon">📋</span> Stok</div>
        </div>
    </div>

    <!-- FLOATING BULK BAR -->
    <div class="bulk-action-bar" id="bulkActionBar">
        <span id="bulkCount">0 Dipilih</span>
        <button class="bulk-btn bulk-btn-out" id="btnBulkOut" onclick="outTerpilih()">Keluarkan</button>
        <button class="bulk-btn bulk-btn-del" onclick="hapusTerpilih()">Hapus</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSaLtB4b2XyuisVAJ-Djf1RQDtXyOy5_U",
            authDomain: "bizsight-33tbg.firebaseapp.com",
            databaseURL: "https://bizsight-33tbg-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bizsight-33tbg",
            storageBucket: "bizsight-33tbg.firebasestorage.app",
            messagingSenderId: "333910528874",
            appId: "1:333910528874:web:c6632d3517a157a3584b13"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const kartonRef = ref(db, 'stok_fg_wh');
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            document.getElementById('loginScreen').style.display = user ? "none" : "flex";
            document.getElementById('mainApp').style.display = user ? "block" : "none";
        });

        document.getElementById('btnGoogleLogin').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('btnLogout').addEventListener('click', () => { if(confirm("Keluar dari sistem?")) signOut(auth); });

        const btnDarkMode = document.getElementById('btnDarkMode');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            btnDarkMode.innerHTML = '☀️';
        }
        btnDarkMode.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                btnDarkMode.innerHTML = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                btnDarkMode.innerHTML = '🌙';
                localStorage.setItem('theme', 'light');
            }
        });

        document.getElementById('tanggalInput').valueAsDate = new Date();
        let rawData = [];
        window.currentEditId = null; 
        window.selectedIds = new Set();

        // ====================================================
        // TAUTAN GOOGLE APPS SCRIPT ANDA
        // ====================================================
        const URL_GAS_STOK = "https://script.google.com/macros/s/AKfycbx8L2vRZpk-Snzso7zoaJTjSTXojRmNDFcVedFqB-aZM3g0-qMPyTzShmn4qc9Lv52c/exec"; 
        const URL_GAS_LOKASI = "https://script.google.com/macros/s/AKfycbybzDGzNTQu4XJxxGHAvWTv0lFF_W7RsFNrFvo_a8wPadknNphzFTGBPtvS8cbjckxB/exec"; 
        
        let dataLokasiExcel = [];
        let dataStokExcel = []; 

        // ====================================================
        // SINKRONISASI STOK EXCEL (TAB INPUT)
        // ====================================================
        document.getElementById('btnTarikSO').addEventListener('click', async () => {
            const soTarget = document.getElementById('soTarikExcel').value.toUpperCase().trim();
            const statusDiv = document.getElementById('statusTarik');
            
            if(!soTarget) return statusDiv.innerText = "❌ Harap masukkan nomor SO terlebih dahulu.";

            statusDiv.innerText = "⏳ Sedang memuat data Stok untuk SO " + soTarget + "...";
            statusDiv.style.color = "var(--text-main)";

            try {
                const responseStok = await fetch(URL_GAS_STOK + "?so=" + encodeURIComponent(soTarget));
                const dataStok = await responseStok.json();

                if(dataStok.error) {
                    statusDiv.innerText = dataStok.error;
                    statusDiv.style.color = "var(--primary)";
                    return;
                }
                dataStokExcel = dataStok; 

                if(dataStokExcel.length > 0) {
                    document.getElementById('soInput').value = dataStokExcel[0].so || soTarget;
                    document.getElementById('artikelInput').value = dataStokExcel[0].artikel || "";
                } else {
                    document.getElementById('soInput').value = soTarget; 
                }

                document.getElementById('lokasiInput').value = "";
                statusDiv.innerText = `✅ BERHASIL! ${dataStokExcel.length} Karton berhasil dimuat.`;
                statusDiv.style.color = "var(--secondary)"; 
                
            } catch (err) {
                statusDiv.innerText = '❌ Gagal terhubung ke server Excel.';
                statusDiv.style.color = 'var(--primary)';
            }
        });

        // ====================================================
        // TAB LOKASI SO (GRID CARDS)
        // ====================================================
        document.getElementById('btnSyncLokasi').addEventListener('click', async () => {
            const statusDiv = document.getElementById('statusLokasi');
            statusDiv.innerText = '⏳ Sedang mengunduh data lokasi dari Spreadsheet...';
            statusDiv.style.color = 'var(--text-main)';
            try {
                const response = await fetch(URL_GAS_LOKASI);
                dataLokasiExcel = await response.json();
                
                if (!Array.isArray(dataLokasiExcel)) throw new Error("Format respons tidak valid.");

                statusDiv.innerText = `✅ Berhasil memuat ${dataLokasiExcel.length} lokasi terbaru!`;
                statusDiv.style.color = 'var(--secondary)'; 
                renderDataLokasi();
            } catch (error) {
                statusDiv.innerText = '❌ Gagal terhubung ke peladen lokasi Excel.';
                statusDiv.style.color = 'var(--primary)';
            }
        });

        document.getElementById('filterCariLokasi').addEventListener('input', renderDataLokasi);

        function renderDataLokasi() {
            const grid = document.getElementById('gridLokasi');
            const filter = document.getElementById('filterCariLokasi').value.toUpperCase().trim();
            grid.innerHTML = '';

            if(dataLokasiExcel.length === 0) return grid.innerHTML = '<p style="text-align:center; font-weight:800; margin-top:20px; color:var(--text-muted); grid-column: 1 / -1;">Klik tombol Unduh di atas terlebih dahulu.</p>';
            if(!filter) return grid.innerHTML = '<p style="text-align:center; font-weight:800; margin-top:20px; color:var(--text-muted); grid-column: 1 / -1;">Ketikkan nomor SO pada kolom pencarian 👆</p>';

            let filtered = dataLokasiExcel.filter(d => (d.so || "").toUpperCase().includes(filter));
            if (filtered.length === 0) return grid.innerHTML = '<p style="text-align:center; font-weight:800; margin-top:20px; color:var(--primary); grid-column: 1 / -1;">❌ SO tidak ditemukan.</p>';

            filtered.forEach(d => {
                grid.innerHTML += `
                    <div class="card-grid-item">
                        <div class="so-badge">${d.so}</div>
                        <div>
                            <div class="label-sm">LOKASI RAK</div>
                            <div style="font-size: 18px; font-weight: 900; color: #eab308; margin-top: 4px;">📍 ${d.lokasi}</div>
                        </div>
                    </div>`;
            });
        }

        // ====================================================
        // TAB DAFTAR STOK SO (GRID CARDS)
        // ====================================================
        document.getElementById('btnCariListStok').addEventListener('click', async () => {
            const soTarget = document.getElementById('inputCariListStok').value.toUpperCase().trim();
            const statusDiv = document.getElementById('statusListStok');
            const summaryContainer = document.getElementById('summaryStokContainer');
            const grid = document.getElementById('gridListStok');
            
            grid.innerHTML = '';
            summaryContainer.innerHTML = '';
            
            if(!soTarget) {
                statusDiv.innerText = "❌ Harap masukkan nomor SO terlebih dahulu.";
                return;
            }

            statusDiv.innerText = "⏳ Mencari data stok SO " + soTarget + "...";
            statusDiv.style.color = "var(--text-main)";

            try {
                const response = await fetch(URL_GAS_STOK + "?so=" + encodeURIComponent(soTarget));
                const data = await response.json();

                if(data.error) {
                    statusDiv.innerText = data.error;
                    statusDiv.style.color = "var(--primary)";
                } else if(data.length === 0) {
                    statusDiv.innerText = "❌ Tidak ada karton yang ditandai untuk SO ini di sistem utama.";
                    statusDiv.style.color = "var(--primary)";
                } else {
                    statusDiv.innerText = `✅ Data berhasil dimuat.`;
                    statusDiv.style.color = "var(--secondary)"; 
                    
                    summaryContainer.innerHTML = `
                        <div class="summary-panel">
                            <h2>${data.length}</h2>
                            <span>TOTAL KARTON SIAP PRODUKSI</span>
                        </div>
                    `;
                    
                    data.forEach(d => {
                        grid.innerHTML += `
                            <div class="card-grid-item">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span class="so-badge">${d.so}</span>
                                    <span class="size-badge">${d.size}</span>
                                </div>
                                <div style="display: flex; flex-direction: column;">
                                    <span class="label-sm">KARTON</span>
                                    <span class="val-text" style="margin-left: 0; font-size:16px;">${d.karton}</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border); padding-top: 8px;">
                                    <span class="label-sm">ARTIKEL</span>
                                    <span class="artikel-val" style="font-size: 13px;">${d.artikel}</span>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                statusDiv.innerText = "❌ Gagal terhubung ke server!";
                statusDiv.style.color = "var(--primary)";
            }
        });

        // ====================================================
        // LOGIKA FORM & LISTENER
        // ====================================================
        function applyUppercaseListener() {
            document.querySelectorAll('input[type="text"]').forEach(input => {
                if(!input.hasAttribute('data-upper')) {
                    input.setAttribute('data-upper', 'true');
                    input.addEventListener('input', function() { this.value = this.value.toUpperCase(); });
                }
            });
        }
        
        function applyKartonFormatListener() {
            document.querySelectorAll('.nokarton-input').forEach(input => {
                if(!input.hasAttribute('data-format')) {
                    input.setAttribute('data-format', 'true');
                    
                    input.addEventListener('input', function() { 
                        this.value = this.value.replace(/[^0-9#]/g, ''); 
                        let val = this.value.trim();
                        if(val !== '' && !val.startsWith('#')) val = '#' + val;

                        if (val && dataStokExcel && dataStokExcel.length > 0) {
                            let match = dataStokExcel.find(m => m.karton === val);
                            if (match) {
                                let row = this.closest('.karton-item');
                                row.querySelector('.size-input').value = match.size;
                                
                                if(!document.getElementById('soInput').value) document.getElementById('soInput').value = match.so;
                                if(!document.getElementById('artikelInput').value) document.getElementById('artikelInput').value = match.artikel;
                            }
                        }
                    });

                    input.addEventListener('blur', function() {
                        let val = this.value.trim();
                        if(val !== '' && !val.startsWith('#')) this.value = '#' + val;
                    });
                }
            });
        }

        applyUppercaseListener(); applyKartonFormatListener();

        document.getElementById('btnTambahBaris').addEventListener('click', () => {
            const list = document.getElementById('kartonList');
            const row = document.createElement('div');
            row.className = 'form-row karton-item';
            row.style.marginBottom = '12px';
            row.innerHTML = `<input type="text" class="form-input size-input" placeholder="Ukuran"><input type="text" inputmode="numeric" class="form-input nokarton-input" placeholder="No. Karton"><button class="btn-hapus-baris" onclick="this.parentElement.remove()">❌</button>`;
            list.appendChild(row);
            applyUppercaseListener(); applyKartonFormatListener();
        });

        window.hapusBaris = (btn) => btn.parentElement.remove();

        window.batalEdit = () => {
            window.currentEditId = null; 
            const btnTbh = document.getElementById('btnTambah');
            btnTbh.innerHTML = "Simpan Data Stok"; 
            document.getElementById('editActionGroup').style.display = "none";
            document.getElementById('btnTambahBaris').style.display = "block"; 
            document.getElementById('tanggalInput').valueAsDate = new Date();
            ['soInput','artikelInput','lokasiInput','keteranganInput'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('jenisInput').value = 'SOLID'; 
            document.getElementById('kartonList').innerHTML = `<div class="form-row karton-item" style="margin-bottom: 12px;"><input type="text" class="form-input size-input" placeholder="Ukuran"><input type="text" inputmode="numeric" class="form-input nokarton-input" placeholder="No. Karton"><button class="btn-hapus-baris" onclick="hapusBaris(this)" style="display:none;">❌</button></div>`;
            applyUppercaseListener(); applyKartonFormatListener();
        }

        window.toggleDropdown = (headerEl) => {
            const grid = headerEl.nextElementSibling;
            const icon = headerEl.querySelector('.toggle-icon');
            if (grid.style.display === 'none') {
                grid.style.display = 'flex'; 
                icon.innerText = '▼';
            } else {
                grid.style.display = 'none'; 
                icon.innerText = '▶';
            }
        };

        window.openTab = (tabName, elmnt) => {
            if(tabName !== 'tabInput' && window.currentEditId !== null) batalEdit();
            window.selectedIds.clear();
            updateBulkDeleteUI();
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            elmnt.classList.add('active');
            
            if (tabName === 'tabAktif' || tabName === 'tabRiwayat') renderData();
        }

        document.getElementById('btnTambah').addEventListener('click', async () => {
            const val = (id) => document.getElementById(id).value.toUpperCase().trim();
            const tanggal = document.getElementById('tanggalInput').value; 
            const jenis = document.getElementById('jenisInput').value; 
            const so = val('soInput'), artikel = val('artikelInput'), lokasi = val('lokasiInput'), keterangan = val('keteranganInput');

            if(!so || !artikel || !lokasi) return alert("Nomor SO, Artikel, dan Lokasi wajib diisi dengan lengkap.");

            let dataToPush = [], isErrorPartial = false;
            document.querySelectorAll('.karton-item').forEach(item => {
                const sizeInput = item.querySelector('.size-input').value.toUpperCase().trim();
                let noKartonInput = item.querySelector('.nokarton-input').value.toUpperCase().trim();
                if(noKartonInput && !noKartonInput.startsWith('#')) noKartonInput = '#' + noKartonInput;

                if(sizeInput && noKartonInput) dataToPush.push({ size: sizeInput, noKarton: noKartonInput });
                else if (sizeInput || noKartonInput) isErrorPartial = true; 
            });

            if(isErrorPartial) return alert("Terdapat baris isian yang belum lengkap.");
            if(dataToPush.length === 0) return alert("Harap isi minimal 1 pasang Ukuran dan No. Karton!");

            const userName = auth.currentUser ? (auth.currentUser.displayName || auth.currentUser.email) : "Pengguna Web";
            
            if (window.currentEditId) {
                if(dataToPush.length > 1) return alert("Mode Ubah hanya dapat menyimpan 1 karton.");
                await update(ref(db, `stok_fg_wh/${window.currentEditId}`), {
                    tanggal, so_number: so, jenis, artikel, size: dataToPush[0].size, nomor_karton: dataToPush[0].noKarton, lokasi, keterangan, diinput_oleh: userName 
                });
                alert("Data berhasil diperbarui!");
                batalEdit(); openTab('tabAktif', document.querySelectorAll('.tab-btn')[1]); 
            } else {
                for(let kData of dataToPush) {
                    await set(push(kartonRef), { 
                        tanggal, so_number: so, jenis, artikel, size: kData.size, nomor_karton: kData.noKarton, lokasi, keterangan, status: "AKTIF", diinput_oleh: userName, timestamp_in: serverTimestamp()
                    });
                }
                alert(dataToPush.length > 1 ? `BERHASIL! ${dataToPush.length} Karton disimpan.` : "Data berhasil disimpan!");
                batalEdit(); 
            }
        });

        window.hapusPermanen = async () => {
            if(!window.currentEditId) return;
            if(confirm("Apakah Anda yakin ingin menghapus data ini secara permanen dari sistem?")) {
                await remove(ref(db, `stok_fg_wh/${window.currentEditId}`)); 
                alert("Data dihapus!"); batalEdit(); openTab('tabAktif', document.querySelectorAll('.tab-btn')[1]); 
            }
        };

        window.hapusSemuaSO = async (e, soTarget, statusFilter) => {
            e.stopPropagation();
            const dataToDelete = rawData.filter(d => (d.so_number || "").toUpperCase() === soTarget && d.status === statusFilter);
            if(dataToDelete.length === 0) return alert('Data tidak ditemukan.');

            if (!confirm(`⚠️ PERINGATAN KRITIS!\nAnda akan menghapus PERMANEN ${dataToDelete.length} karton untuk SO ${soTarget}. Lanjutkan?`)) return;
            
            for(let item of dataToDelete) {
                await remove(ref(db, `stok_fg_wh/${item.id}`));
            }
            alert(`Sukses! ${dataToDelete.length} karton dengan SO ${soTarget} berhasil dihapus.`);
            renderData();
        }

        window.editSemuanya = (id) => {
            let item = rawData.find(d => d.id === id);
            if(!item) return;
            document.getElementById('tanggalInput').value = item.tanggal;
            document.getElementById('soInput').value = item.so_number;
            document.getElementById('jenisInput').value = item.jenis || 'SOLID'; 
            document.getElementById('artikelInput').value = item.artikel;
            document.getElementById('lokasiInput').value = item.lokasi;
            document.getElementById('keteranganInput').value = item.keterangan || '';
            document.getElementById('kartonList').innerHTML = `<div class="form-row karton-item" style="margin-bottom: 12px;"><input type="text" class="form-input size-input" value="${item.size}"><input type="text" inputmode="numeric" class="form-input nokarton-input" value="${item.nomor_karton}"><button class="btn-hapus-baris" style="display:none;">❌</button></div>`;
            applyUppercaseListener(); applyKartonFormatListener();
            window.currentEditId = id;
            document.getElementById('btnTambah').innerHTML = "Perbarui Data";
            document.getElementById('btnTambahBaris').style.display = "none";
            document.getElementById('editActionGroup').style.display = "flex";
            openTab('tabInput', document.getElementById('btnTabInput'));
        }

        onValue(kartonRef, (snapshot) => {
            rawData = [];
            snapshot.forEach((child) => {
                let data = child.val(); data.id = child.key;
                let sizeStr = data.size.toString().toUpperCase();
                data.sizeValue = parseFloat(sizeStr.replace('T', '.5')); 
                rawData.push(data);
            });
            renderData();
        });

        window.toggleSelect = (cb) => {
            cb.checked ? window.selectedIds.add(cb.value) : window.selectedIds.delete(cb.value);
            updateBulkDeleteUI();
        }

        window.updateBulkDeleteUI = () => {
            const bar = document.getElementById('bulkActionBar');
            if (window.selectedIds.size > 0) {
                bar.style.display = 'flex';
                document.getElementById('bulkCount').innerText = `${window.selectedIds.size} Dipilih`;
                document.getElementById('btnBulkOut').style.display = document.getElementById('tabRiwayat').classList.contains('active') ? 'none' : 'block';
            } else {
                bar.style.display = 'none';
            }
        }

        window.outTerpilih = async () => {
            if(confirm(`Keluarkan ${window.selectedIds.size} kardus yang dipilih ke riwayat?`)) {
                for (let id of window.selectedIds) {
                    let tzoffset = (new Date()).getTimezoneOffset() * 60000;
                    let localISOTime = (new Date(Date.now() - tzoffset)).toISOString().slice(0, 10);
                    await update(ref(db, `stok_fg_wh/${id}`), { status: "OUT", tanggal_out: localISOTime, timestamp_out: serverTimestamp() });
                }
                window.selectedIds.clear(); updateBulkDeleteUI(); alert("Berhasil dikeluarkan.");
            }
        }

        window.hapusTerpilih = async () => {
            if(confirm(`Hapus permanen ${window.selectedIds.size} kardus yang dipilih?`)) {
                for (let id of window.selectedIds) { await remove(ref(db, `stok_fg_wh/${id}`)); }
                window.selectedIds.clear(); updateBulkDeleteUI(); alert("Berhasil dihapus.");
            }
        }

        function renderData() {
            const gridAktif = document.getElementById('gridKartonAktif');
            const gridRiwayat = document.getElementById('gridRiwayatOut');
            
            const fAktif = document.getElementById('filterSOAktif').value.toUpperCase().trim();
            const fRiwayat = document.getElementById('filterSORiwayat').value.toUpperCase().trim();
            const fTglRiwayatInput = document.getElementById('filterTanggalRiwayat').value;
            
            gridAktif.innerHTML = ''; gridRiwayat.innerHTML = ''; 

            let dataAktif = rawData.filter(d => {
                if (d.status !== "AKTIF") return false;
                if (!fAktif) return true;
                return (d.so_number || "").toUpperCase().includes(fAktif) ||
                       (d.artikel || "").toUpperCase().includes(fAktif) ||
                       (d.diinput_oleh || "").toUpperCase().includes(fAktif);
            });

            let dataOut = rawData.filter(d => {
                if (d.status !== "OUT") return false;

                let tglLokal = "";
                if (d.tanggal_out) {
                    let [y, m, day] = d.tanggal_out.split('-');
                    if (y && m && day) {
                        tglLokal = new Date(y, m-1, day).toLocaleDateString('id-ID').toUpperCase();
                    }
                }

                let matchText = true;
                if(fRiwayat) {
                    matchText = (d.so_number || "").toUpperCase().includes(fRiwayat) ||
                                (d.artikel || "").toUpperCase().includes(fRiwayat) ||
                                (d.diinput_oleh || "").toUpperCase().includes(fRiwayat) ||
                                (d.tanggal_out || "").toUpperCase().includes(fRiwayat) || 
                                tglLokal.includes(fRiwayat); 
                }

                let matchKalender = true;
                if(fTglRiwayatInput) {
                    matchKalender = (d.tanggal_out === fTglRiwayatInput);
                }

                return matchText && matchKalender; 
            });

            let soArtikelMap = {};
            rawData.filter(d => d.status === "AKTIF").forEach(d => {
                let so = (d.so_number || "").toUpperCase(), art = (d.artikel || "").toUpperCase();
                if (!soArtikelMap[so]) soArtikelMap[so] = new Set();
                if (art) soArtikelMap[so].add(art);
            });

            const sorter = (a, b) => {
                if (a.so_number !== b.so_number) return a.so_number.localeCompare(b.so_number);
                if (a.sizeValue !== b.sizeValue) return a.sizeValue - b.sizeValue;
                return a.nomor_karton.localeCompare(b.nomor_karton);
            };
            dataAktif.sort(sorter); dataOut.sort(sorter);

            function buildPivotHTML(dataArray, isHistory) {
                if (dataArray.length === 0) return '<div style="text-align:center; margin-top:40px;"><span style="font-size:40px;">📭</span><p style="color:var(--text-muted); font-weight:800; margin-top:10px;">Tidak ada data yang ditemukan.</p></div>';
                let groupedBySOArt = {};
                dataArray.forEach(d => {
                    let so = (d.so_number || "TANPA SO").toUpperCase(), art = (d.artikel || "TANPA ARTIKEL").toUpperCase();
                    let key = so + "|||" + art; 
                    if (!groupedBySOArt[key]) groupedBySOArt[key] = { so: so, art: art, items: [] };
                    groupedBySOArt[key].items.push(d);
                });

                let htmlOutput = '';
                Object.keys(groupedBySOArt).sort().forEach(key => {
                    let group = groupedBySOArt[key];
                    let btnHapusSO = `<button onclick="hapusSemuaSO(event, '${group.so}', '${isHistory ? 'OUT' : 'AKTIF'}')" class="btn-delete-so">🗑️ Hapus SO</button>`;

                    htmlOutput += `
                        <div class="pivot-group-header" onclick="toggleDropdown(this)">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span class="toggle-icon" style="font-size:10px; color:var(--text-muted);">▼</span>
                                <span>📦 SO : <b style="color:var(--primary);">${group.so}</b> | ${group.art}</span>
                            </div>
                            <div style="display:flex; align-items:center;">
                                <span class="pivot-count">${group.items.length} Box</span>
                                ${btnHapusSO}
                            </div>
                        </div>
                        <div class="grouped-grid">
                    `;
                    group.items.forEach(data => {
                        let htmlKeterangan = data.keterangan ? `<div class="ket-box">📝 ${data.keterangan}</div>` : '';
                        let badgeJenis = data.jenis === 'MIX' ? `<span class="badge-jenis badge-mix">MIX</span>` : `<span class="badge-jenis badge-solid">SOLID</span>`;
                        let isChecked = window.selectedIds.has(data.id) ? 'checked' : '';
                        
                        let tglTampil = data.tanggal;
                        if (isHistory) {
                            tglTampil = data.tanggal_out;
                            if (tglTampil && tglTampil.includes('-')) {
                                let [y, m, d] = tglTampil.split('-');
                                tglTampil = new Date(y, m-1, d).toLocaleDateString('id-ID');
                            }
                        }

                        // DESAIN KARTU PERSIS SEPERTI GAMBAR REFERENSI
                        htmlOutput += `
                            <div class="mini-card">
                                <div style="display: flex; align-items: center; margin-bottom: 12px;">
                                    <input type="checkbox" class="chk-select" value="${data.id}" onchange="toggleSelect(this)" ${isChecked}>
                                    <span style="font-weight: 900; font-size: 16px; color:var(--text-main);">${data.so_number}</span>
                                </div>
                                
                                <div class="full-box">
                                    <span class="size-text">${data.size}</span>
                                </div>
                                
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                    <span class="label-sm" style="color:var(--text-muted);">${isHistory ? 'KELUAR : ' : ''}${tglTampil}</span>
                                    ${badgeJenis}
                                </div>
                                
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
                                    <div style="display: flex; align-items: baseline; gap: 6px;">
                                        <span class="label-sm">KARTON</span>
                                        <span class="val-text">${data.nomor_karton}</span>
                                    </div>
                                    <div style="display: flex; align-items: baseline; gap: 6px;">
                                        <span class="label-sm">LOKASI</span>
                                        <span class="val-text">${data.lokasi}</span>
                                    </div>
                                </div>
                                
                                <div class="full-box" style="display: flex; justify-content: space-between; align-items: center;">
                                    <span class="label-sm">ARTIKEL</span>
                                    <span class="artikel-val">${data.artikel}</span>
                                </div>
                                
                                ${htmlKeterangan}
                                
                                <div class="dotted-divider">
                                    <span class="label-sm" style="color:var(--text-main); text-transform:none;">Oleh : ${data.diinput_oleh || 'Sistem'}</span>
                                </div>
                                
                                ${!isHistory ? `
                                <div class="action-row">
                                    <button class="btn-edit" onclick="editSemuanya('${data.id}')">UBAH</button>
                                    <button class="btn-out" onclick="pindahKeRiwayat('${data.id}')">KELUAR</button>
                                </div>` : ''}
                            </div>`;
                    });
                    htmlOutput += `</div>`; 
                });
                return htmlOutput;
            }

            gridAktif.innerHTML = buildPivotHTML(dataAktif, false);
            gridRiwayat.innerHTML = buildPivotHTML(dataOut, true);
            updateBulkDeleteUI();
        }

        document.getElementById('filterSOAktif').addEventListener('input', renderData);
        document.getElementById('filterSORiwayat').addEventListener('input', renderData);
        document.getElementById('filterTanggalRiwayat').addEventListener('input', renderData);

        window.pindahKeRiwayat = async (id) => {
            if(confirm("Keluarkan data barang ini (OUT)?")) {
                let tzoffset = (new Date()).getTimezoneOffset() * 60000;
                let localISOTime = (new Date(Date.now() - tzoffset)).toISOString().slice(0, 10);
                await update(ref(db, `stok_fg_wh/${id}`), { status: "OUT", tanggal_out: localISOTime, timestamp_out: serverTimestamp() }); 
            }
        };
    </script>
</body>
</html>
