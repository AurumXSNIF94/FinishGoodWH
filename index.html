<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SI Carton Tracker</title>
    
    <link rel="icon" type="image/png" href="NBicon.png">

    <style>
        :root {
            --bg-color:#f4f7fb;
            --surface:#ffffff;
            --surface-soft:#f8fafc;
            --primary:#2563eb;
            --primary-hover:#1d4ed8;
            --secondary:#10b981;
            --dark:#0f172a;
            --text-main:#0f172a;
            --text-muted:#64748b;
            --border:#e2e8f0;
            --input-bg:#f8fafc;
            --danger-bg:#fef2f2;
            --danger-text:#dc2626;
            --warning-bg:#fffbeb;
            --warning-text:#b45309;
            --info-bg:#eff6ff;
            --info-text:#1d4ed8;
            --radius-xl:22px;
            --radius-lg:18px;
            --radius-md:13px;
            --radius-sm:10px;
            --shadow-float:0 12px 40px rgba(15,23,42,.10);
            --shadow-card:0 4px 18px rgba(15,23,42,.06);
            --header-h:64px;
            --nav-h:72px;
        }

        body.dark-mode {
            color-scheme:dark;
            --bg-color:#0b1120;
            --surface:#111827;
            --surface-soft:#0f172a;
            --primary:#60a5fa;
            --primary-hover:#93c5fd;
            --secondary:#34d399;
            --dark:#f8fafc;
            --text-main:#f8fafc;
            --text-muted:#94a3b8;
            --border:#243244;
            --input-bg:#0f172a;
            --danger-bg:#3b0b12;
            --danger-text:#fca5a5;
            --warning-bg:#3a2606;
            --warning-text:#fcd34d;
            --info-bg:#13264a;
            --info-text:#93c5fd;
            --shadow-float:0 14px 50px rgba(0,0,0,.35);
            --shadow-card:0 6px 18px rgba(0,0,0,.18);
        }

        * { box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body {
            font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
            background:var(--bg-color);
            color:var(--text-main);
            margin:0;
            min-height:100vh;
            font-size:14px;
            -webkit-font-smoothing:antialiased;
            padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));
            transition:background-color .25s ease,color .25s ease;
        }
        button,input,select { font:inherit; }
        button,a { -webkit-tap-highlight-color:transparent; }
        button { touch-action:manipulation; }

        /* APP HEADER */
        .app-header {
            min-height:var(--header-h);
            position:sticky;
            top:0;
            z-index:50;
            display:grid;
            grid-template-columns:44px 1fr auto;
            align-items:center;
            gap:10px;
            padding:10px max(14px, env(safe-area-inset-left)) 10px max(14px, env(safe-area-inset-right));
            background:color-mix(in srgb,var(--surface) 90%,transparent);
            border-bottom:1px solid var(--border);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
        }
        .app-header img { height:28px; width:auto; object-fit:contain; justify-self:center; }
        .header-left,.header-right { display:flex; align-items:center; gap:8px; }
        .header-left { justify-self:start; }
        .header-right { justify-self:end; }
        .btn-mode,.btn-logout,.btn-sheet-header {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border:1px solid var(--border);
            color:var(--text-main);
            background:var(--surface-soft);
            cursor:pointer;
            transition:.2s ease;
        }
        .btn-mode {
            width:40px;height:40px;border-radius:12px;padding:0;font-size:16px;
        }
        .btn-mode:hover,.btn-logout:hover,.btn-sheet-header:hover { border-color:var(--primary); transform:translateY(-1px); }
        .btn-logout { height:40px; padding:0 12px; border-radius:12px; font-size:11px; font-weight:900; }
        .btn-sheet-header { height:40px; padding:0 12px; border-radius:12px; gap:6px; font-size:11px; font-weight:900; text-decoration:none; }

        /* LOGIN */
        #loginScreen {
            position:fixed; inset:0; z-index:9999;
            display:flex; align-items:center; justify-content:center;
            padding:20px;
            background:var(--bg-color);
        }
        .login-box {
            width:min(100%,380px);
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:26px;
            padding:36px 26px 28px;
            text-align:center;
            box-shadow:var(--shadow-float);
        }
        .login-box img { height:88px; width:auto; object-fit:contain; margin-bottom:6px; }
        .login-box h2 { margin:0 0 8px; font-size:24px; font-weight:900; letter-spacing:-.5px; }
        .login-box p { margin:0 0 28px; color:var(--text-muted); font-size:13px; }
        .btn-google {
            width:100%; min-height:48px; padding:12px 16px;
            display:flex; align-items:center; justify-content:center; gap:10px;
            background:var(--surface); color:var(--text-main);
            border:1px solid var(--border); border-radius:14px;
            font-size:14px; font-weight:800; cursor:pointer; box-shadow:var(--shadow-card);
        }
        .btn-google img { height:20px; margin:0; }

        /* CONTENT */
        .content { display:none; max-width:1180px; margin:0 auto; padding:18px 16px 26px; animation:slideUp .25s ease; }
        .content.active { display:block; }
        @keyframes slideUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

        /* STICKY SEARCH */
        .sticky-filter {
            position:sticky;
            top:var(--header-h);
            z-index:15;
            display:flex;
            gap:10px;
            padding:10px 0 14px;
            background:linear-gradient(var(--bg-color) 75%, transparent);
        }
        input.search-box {
            width:100%; min-height:46px; padding:11px 16px;
            border:1px solid var(--border); border-radius:14px;
            background:var(--surface); color:var(--text-main);
            box-shadow:var(--shadow-card); outline:none;
            font-size:14px; font-weight:700;
        }
        input.search-box:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(37,99,235,.10); }

        /* AUTO PULL / FORM */
        .auto-pull-card {
            background:linear-gradient(180deg,var(--surface),var(--surface-soft));
            border:1px solid var(--border);
            border-radius:var(--radius-xl);
            padding:16px;
            margin-bottom:14px;
            box-shadow:var(--shadow-card);
        }
        .section-kicker { font-size:10px; font-weight:900; color:var(--primary); text-transform:uppercase; letter-spacing:.9px; margin-bottom:10px; }
        .pull-row { display:flex; gap:9px; }
        .pull-row .form-input { flex:1; min-width:0; }
        .btn-sync {
            min-width:88px; min-height:48px; border:0; border-radius:13px;
            background:var(--text-main); color:var(--surface); font-weight:900; cursor:pointer;
        }
        .status-line { margin-top:10px; min-height:18px; font-size:11px; font-weight:800; }
        .order-meta { display:none; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:12px; }
        .order-meta.show { display:grid; }
        .meta-chip { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px; min-width:0; }
        .meta-chip .meta-label { display:block; font-size:9px; color:var(--text-muted); font-weight:900; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
        .meta-chip .meta-value { display:block; font-size:12px; font-weight:900; color:var(--text-main); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

        .form-card {
            background:var(--surface); padding:18px;
            border-radius:var(--radius-xl); border:1px solid var(--border);
            box-shadow:var(--shadow-card); margin-bottom:22px;
        }
        .form-card h3 { margin:0 0 18px; display:flex; align-items:center; gap:8px; font-size:17px; font-weight:900; }
        .form-row { display:flex; gap:10px; margin-bottom:10px; }
        .form-row > * { flex:1; min-width:0; }
        input.form-input, select.form-select {
            width:100%; min-height:48px; padding:12px 14px;
            border:1px solid var(--border); border-radius:12px;
            background:var(--input-bg); color:var(--text-main);
            font-size:14px; font-weight:700; outline:none;
        }
        input.form-input:focus, select.form-select:focus { border-color:var(--primary); background:var(--surface); box-shadow:0 0 0 4px rgba(37,99,235,.08); }
        .dynamic-box { background:var(--bg-color); border:1px dashed var(--border); padding:14px; border-radius:16px; margin:15px 0; }
        .dynamic-header { margin-bottom:10px; color:var(--text-muted); font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.9px; }
        .karton-item { align-items:center; }
        .karton-item .size-input { max-width:150px; }
        .btn-tambah-baris { min-height:44px; width:100%; padding:10px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text-main); font-weight:800; cursor:pointer; }
        .btn-hapus-baris { width:44px; min-width:44px; min-height:44px; border:0; border-radius:11px; background:var(--danger-bg); color:var(--danger-text); cursor:pointer; }
        .btn-add {
            min-height:50px; width:100%; padding:14px 18px; border:0; border-radius:14px;
            background:linear-gradient(135deg,var(--primary),var(--primary-hover)); color:#fff;
            font-weight:900; font-size:14px; cursor:pointer; box-shadow:0 8px 20px rgba(37,99,235,.22);
        }

        /* GROUPS + CARDS */
        .pivot-group-header {
            display:flex; align-items:center; justify-content:space-between; gap:10px;
            padding:13px 14px; margin:12px 0 10px;
            border:1px solid var(--border); border-radius:15px;
            background:var(--surface); box-shadow:var(--shadow-card);
            color:var(--text-main); cursor:pointer;
        }
        .pivot-head-left { display:flex; align-items:center; gap:8px; min-width:0; }
        .pivot-head-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .pivot-count { white-space:nowrap; background:var(--surface-soft); border:1px solid var(--border); border-radius:9px; padding:6px 9px; font-size:10px; font-weight:900; }
        .btn-delete-so { min-height:34px; border:0; border-radius:9px; padding:6px 9px; background:var(--danger-bg); color:var(--danger-text); font-size:10px; font-weight:900; cursor:pointer; }
        .premium-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:14px; }
        .premium-grid.single-col { grid-template-columns:1fr; }

        .premium-card {
            background:var(--surface); border:1px solid var(--border); border-radius:18px;
            padding:14px; box-shadow:var(--shadow-card); display:flex; flex-direction:column; min-width:0;
        }
        .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:10px; }
        .card-so-wrap { display:flex; align-items:center; gap:8px; min-width:0; }
        .card-so { font-size:13px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .chk-select,.chk-select-stok { width:20px; height:20px; margin:0; accent-color:var(--primary); flex:none; }
        .chk-select-stok { accent-color:var(--secondary); }
        .badge-tipe { display:inline-flex; align-items:center; justify-content:center; padding:4px 7px; border-radius:7px; font-size:9px; font-weight:900; text-transform:uppercase; white-space:nowrap; }
        .badge-solid { background:var(--surface-soft); color:var(--text-muted); border:1px solid var(--border); }
        .badge-mix { background:var(--warning-bg); color:var(--warning-text); border:1px solid rgba(251,191,36,.28); }
        .card-mid {
            display:flex; align-items:center; justify-content:space-between; gap:8px;
            padding:10px 12px; background:var(--surface-soft); border:1px solid var(--border);
            border-radius:12px; margin-bottom:10px;
        }
        .card-size { font-size:22px; font-weight:900; color:var(--primary); line-height:1; }
        .card-date { font-size:10px; font-weight:900; color:var(--text-muted); }
        .card-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
        .info-col { display:flex; flex-direction:column; gap:3px; min-width:0; }
        .lbl-sm { font-size:9px; color:var(--text-muted); font-weight:900; text-transform:uppercase; letter-spacing:.5px; }
        .val-md { font-size:13px; font-weight:900; color:var(--text-main); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .val-loc { display:inline-block; font-size:12px; font-weight:900; color:var(--warning-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .card-artikel { padding:8px 10px; margin-bottom:9px; background:var(--bg-color); border:1px dashed var(--border); border-radius:9px; text-align:center; font-size:12px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .card-destination { padding:8px 10px; margin-bottom:9px; background:var(--info-bg); color:var(--info-text); border-radius:9px; font-size:11px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .card-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:10px; border-top:1px dashed var(--border); }
        .card-user { font-size:9px; color:var(--text-muted); font-weight:800; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .action-row { display:flex; gap:8px; margin-top:10px; }
        .action-row button { flex:1; min-height:40px; border-radius:10px; font-size:10px; font-weight:900; cursor:pointer; }
        .btn-edit { background:var(--surface-soft); color:var(--text-main); border:1px solid var(--border); }
        .btn-out { background:var(--text-main); color:var(--surface); border:0; }
        .alert-multi { padding:6px 8px; margin-bottom:8px; border-radius:8px; background:var(--danger-bg); color:var(--danger-text); border:1px dashed var(--danger-text); font-size:9px; font-weight:900; text-align:center; }
        .ket-text { margin-bottom:8px; color:var(--text-muted); font-size:10px; font-style:italic; }

        /* SUMMARY + LOCATION */
        .summary-panel {
            padding:20px; margin-bottom:14px; text-align:left;
            background:linear-gradient(135deg,var(--surface),var(--surface-soft));
            border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-card);
        }
        .summary-top { display:flex; align-items:end; justify-content:space-between; gap:10px; }
        .summary-number { margin:0; font-size:44px; line-height:1; color:var(--secondary); font-weight:900; }
        .summary-label { font-size:10px; color:var(--text-muted); font-weight:900; text-transform:uppercase; letter-spacing:.8px; }
        .summary-so { font-size:12px; font-weight:900; color:var(--primary); background:var(--info-bg); border:1px solid rgba(37,99,235,.15); padding:7px 10px; border-radius:10px; white-space:nowrap; }
        .summary-meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
        .summary-meta span { font-size:10px; font-weight:900; color:var(--text-muted); background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 9px; }
        .lokasi-besar-card { background:var(--warning-bg); border:1px solid rgba(251,191,36,.3); padding:18px; border-radius:18px; box-shadow:var(--shadow-card); display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }

        /* BULK ACTION */
        .bulk-action-bar {
            position:fixed;
            left:50%;
            bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
            transform:translateX(-50%);
            z-index:80;
            display:none;
            align-items:center;
            gap:8px;
            width:min(calc(100% - 24px),560px);
            padding:10px;
            border-radius:16px;
            background:rgba(15,23,42,.95);
            color:#fff;
            border:1px solid rgba(255,255,255,.12);
            box-shadow:var(--shadow-float);
            backdrop-filter:blur(14px);
            -webkit-backdrop-filter:blur(14px);
        }
        .bulk-action-bar span { flex:1; font-size:12px; font-weight:900; padding-left:4px; }
        .bulk-btn { min-height:38px; padding:8px 12px; border:0; border-radius:10px; font-size:10px; font-weight:900; cursor:pointer; }
        .bulk-btn-out { background:var(--secondary); color:#fff; }
        .bulk-btn-del { background:var(--primary); color:#fff; }

        /* BOTTOM NAV */
        .tab-bar {
            position:fixed;
            left:50%; bottom:calc(10px + env(safe-area-inset-bottom));
            transform:translateX(-50%);
            z-index:70;
            width:min(calc(100% - 18px),720px);
            min-height:var(--nav-h);
            display:grid;
            grid-template-columns:repeat(5,1fr);
            gap:3px;
            padding:6px;
            border:1px solid var(--border);
            border-radius:20px;
            background:color-mix(in srgb,var(--surface) 92%,transparent);
            box-shadow:var(--shadow-float);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
        }
        .tab-btn {
            min-width:0; min-height:58px; padding:7px 3px;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
            border-radius:14px; color:var(--text-muted); font-weight:900; font-size:10px; cursor:pointer; white-space:nowrap;
        }
        .tab-btn span.icon { font-size:19px; line-height:1; }
        .tab-btn.active { color:var(--primary); background:var(--info-bg); }
        .tab-btn:active { transform:scale(.97); }

        .empty-state { text-align:center; padding:42px 16px; color:var(--text-muted); }
        .empty-state .empty-icon { font-size:40px; margin-bottom:10px; }

        @media (max-width: 768px) {
            .app-header { grid-template-columns:42px 1fr auto; padding-left:10px; padding-right:10px; }
            .btn-sheet-header { padding:0 9px; }
            .btn-sheet-header .sheet-label { display:none; }
            .btn-logout { padding:0 9px; }
            .content { padding:14px 12px 24px; }
            .premium-grid { grid-template-columns:1fr; }
            .form-row { flex-direction:column; }
            .form-row.karton-item { flex-direction:row; align-items:center; }
            .karton-item .size-input { max-width:none; }
            .order-meta { grid-template-columns:1fr 1fr; }
            .sticky-filter { top:var(--header-h); }
            .summary-number { font-size:38px; }
        }

        @media (max-width: 430px) {
            .btn-sheet-header { display:none; }
            .app-header { grid-template-columns:42px 1fr 74px; }
            .btn-logout { justify-self:end; min-width:68px; }
            .login-box { padding:32px 20px 24px; }
            .order-meta { grid-template-columns:1fr 1fr; }
            .pull-row { gap:7px; }
            .btn-sync { min-width:78px; }
            .premium-card { padding:12px; }
            .pivot-group-header { padding:11px 10px; }
            .pivot-count { font-size:9px; padding:5px 7px; }
            .btn-delete-so { font-size:9px; padding:5px 7px; }
            .tab-btn { font-size:9px; min-height:56px; }
            .tab-btn span.icon { font-size:18px; }
            .bulk-action-bar { width:calc(100% - 18px); }
            .bulk-btn { padding:7px 10px; }
        }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <img src="cover.png" alt="Logo NB">
            <h2>SI Carton Tracker</h2>
            <p>Production Planning | Finished Goods WH</p>
            <button class="btn-google" id="btnGoogleLogin">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                Sign in with Google
            </button>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        
        <div class="app-header">
            <div class="header-left">
                <button class="btn-mode" id="btnDarkMode" aria-label="Toggle dark mode">🌙</button>
            </div>
            <img src="logo.png" alt="SI Carton Tracker">
            <div class="header-right">
                <a href="https://docs.google.com/spreadsheets/d/1GAaC4fSXQk4MIxofH3-E2BQYWtB9RfYP9d7_L85QV-w/edit" target="_blank" class="btn-sheet-header" title="Open Spreadsheet">
                    <span style="font-size:15px;">📗</span><span class="sheet-label">Spreadsheet</span>
                </a>
                <button class="btn-logout" id="btnLogout">Logout</button>
            </div>
        </div>

        <div id="tabInput" class="content">
            <div class="auto-pull-card">
                <div class="section-kicker">⚡ Auto Pull Stock Data</div>
                <div class="pull-row">
                    <input type="text" id="soTarikExcel" class="form-input" placeholder="Enter SO..." autocomplete="off">
                    <button id="btnTarikSO" class="btn-sync">SYNC</button>
                </div>
                <div id="statusTarik" class="status-line"></div>
                <div id="orderMeta" class="order-meta"></div>
            </div>

            <div class="form-card" id="formSmart">
                <h3><span style="font-size:20px;">📝</span> Stock Input</h3>
                <div class="form-row">
                    <input type="date" id="tanggalInput" class="form-input">
                    <input type="text" id="soInput" class="form-input" placeholder="SO Number">
                </div>
                <div class="form-row">
                    <select id="jenisInput" class="form-select">
                        <option value="SOLID">📦 SOLID</option>
                        <option value="MIX">🔀 MIX</option>
                    </select>
                    <input type="text" id="artikelInput" class="form-input" placeholder="Article / Style">
                </div>
                <div class="form-row">
                    <input type="text" id="lokasiInput" class="form-input" placeholder="Location (AR01-000)">
                    <select id="ruanganInput" class="form-select">
                        <option value="">🏭 Select Room</option>
                        <option value="SI 1">SI 1</option>
                        <option value="SI 2">SI 2</option>
                    </select>
                </div>
                <div class="form-row">
                    <input type="text" id="keteranganInput" class="form-input" placeholder="Note (Optional)">
                </div>

                <div class="dynamic-box">
                    <div class="dynamic-header">Carton Details</div>
                    <div id="kartonList">
                        <div class="form-row karton-item" style="margin-bottom:10px;">
                            <input type="text" class="form-input size-input" placeholder="Size">

    <!-- BULK BAR KHUSUS UNTUK STOK FG -->
    <div class="bulk-action-bar" id="bulkActionStokBar" style="background: rgba(16, 185, 129, 0.95); border-color: rgba(255,255,255,0.2);">
        <span id="bulkStokCount">0 Selected</span>
        <button class="bulk-btn" style="background: white; color: var(--secondary);" onclick="pindahkanKeInput()">✨ Manual Input</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSaLtB4b2XyuisVAJ-Djf1RQDtXyOy5_U",
            authDomain: "bizsight-33tbg.firebaseapp.com",
            databaseURL: "https://bizsight-33tbg-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bizsight-33tbg",
            storageBucket: "bizsight-33tbg.firebasestorage.app",
            messagingSenderId: "333910528874",
            appId: "1:333910528874:web:c6632d3517a157a3584b13"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const kartonRef = ref(db, 'stok_fg_wh');
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            document.getElementById('loginScreen').style.display = user ? "none" : "flex";
            document.getElementById('mainApp').style.display = user ? "block" : "none";
        });

        document.getElementById('btnGoogleLogin').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('btnLogout').addEventListener('click', () => { if(confirm("Log out of the system?")) signOut(auth); });

        const btnDarkMode = document.getElementById('btnDarkMode');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            btnDarkMode.innerHTML = '☀️';
        }
        btnDarkMode.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                btnDarkMode.innerHTML = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                btnDarkMode.innerHTML = '🌙';
                localStorage.setItem('theme', 'light');
            }
        });

        document.getElementById('tanggalInput').valueAsDate = new Date();
        let rawData = [];
        window.currentEditId = null; 
        window.editOldSO = null; 
        window.editOldCTN = null; 
        window.selectedIds = new Set();
        
        window.lastFetchedStok = [];
        window.selectedStokKarton = new Set();

        const URL_GAS_STOK = "https://script.google.com/macros/s/AKfycbxxkJTpL49H952n8zE7PePzWrufKdzDJJ15h9LqF21-141TguTw_BHrK8OQCJwtN1vKFA/exec"; 
        const URL_GAS_LOKASI = "https://script.google.com/macros/s/AKfycbwNhXSfLc6OeeOr9nKF2K99iL07XK8qWn7cGjV_kNRC9uyN53OXftX9wbB5pZmVhC8q/exec"; 
        const URL_GAS_REKAP = "https://script.google.com/macros/s/AKfycbwsFkl0I8UNYaKW9DOt5b6OZJIqw-TkwBfZZLWcslwuprzKvh_AKJvVgoLt1VlD1IaScQ/exec";
        
        let dataLokasiExcel = [];
        let dataStokExcel = []; 

        function kirimKeRekap(rowsData) {
            let payloadData = JSON.stringify({ action: "insertRekap", data: rowsData });
            fetch(URL_GAS_REKAP, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: payloadData
            }).then(() => console.log("Trigger GAS IN Terkirim"))
              .catch(e => console.log("Failed:", e));
        }

        function updateRekapKeluar(rowsData) {
            let payloadData = JSON.stringify({ action: "updateKeluar", data: rowsData });
            fetch(URL_GAS_REKAP, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: payloadData
            }).then(() => console.log("Trigger GAS OUT Terkirim"))
              .catch(e => console.log("Failed:", e));
        }

        function editRekapKeGAS(oldSO, oldCTN, newData) {
            let payloadData = JSON.stringify({ 
                action: "editRekap", 
                data: { old_so: oldSO, old_ctn: oldCTN, newData: newData } 
            });
            fetch(URL_GAS_REKAP, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: payloadData
            }).then(() => console.log("Trigger GAS EDIT Terkirim"))
              .catch(e => console.log("Failed:", e));
        }

        document.getElementById('btnTarikSO').addEventListener('click', async () => {
            const soTarget = document.getElementById('soTarikExcel').value.toUpperCase().trim();
            const statusDiv = document.getElementById('statusTarik');
            if(!soTarget) return statusDiv.innerText = "❌ Please enter SO number first.";

            statusDiv.innerText = "⏳ Loading Stock data...";
            statusDiv.style.color = "var(--text-main)";

            try {
                const responseStok = await fetch(URL_GAS_STOK + "?so=" + encodeURIComponent(soTarget));
                const dataStok = await responseStok.json();

                if(dataStok.error) {
                    statusDiv.innerText = dataStok.error;
                    statusDiv.style.color = "var(--primary)";
                    return;
                }
                dataStokExcel = dataStok;

                const orderMeta = document.getElementById('orderMeta');
                if (dataStokExcel.length > 0) {
                    const first = dataStokExcel[0] || {};
                    const metaItems = [
                        ['SO', first.so || soTarget],
                        ['STYLE', first.artikel || '-'],
                        ['DESTINATION', first.destination || '-'],
                        ['PO', first.po || '-']
                    ];
                    orderMeta.innerHTML = metaItems.map(([label, value]) => `
                        <div class="meta-chip">
                            <span class="meta-label">${label}</span>
                            <span class="meta-value">${value}</span>
                        </div>`).join('');
                    orderMeta.classList.add('show');

                    document.getElementById('soInput').value = dataStokExcel[0].so || soTarget;
                    document.getElementById('artikelInput').value = dataStokExcel[0].artikel || '';
                } else {
                    orderMeta.innerHTML = '';
                    orderMeta.classList.remove('show');
                    document.getElementById('soInput').value = soTarget;
                }

                if(dataLokasiExcel.length === 0) {
                    try {
                        const responseLokasi = await fetch(URL_GAS_LOKASI);
                        dataLokasiExcel = await responseLokasi.json();
                    } catch(e) {}
                }

                let lokasiSO = "";
                if(Array.isArray(dataLokasiExcel) && dataLokasiExcel.length > 0) {
                    let matchLoc = dataLokasiExcel.find(l => {
                        let lSo = (l.so || "").toString().toUpperCase().trim();
                        return lSo === soTarget || lSo.includes(soTarget) || soTarget.includes(lSo);
                    });
                    if(matchLoc && matchLoc.lokasi) lokasiSO = matchLoc.lokasi;
                }
                document.getElementById('lokasiInput').value = lokasiSO;

                statusDiv.innerText = `✅ ${dataStokExcel.length} Cartons loaded.` + (lokasiSO ? ` Location: ${lokasiSO}` : ' ⚠️ Location not found, fill manually.');
                statusDiv.style.color = "var(--secondary)"; 
            } catch (err) {
                statusDiv.innerText = '❌ Failed to connect to Spreadsheet server.';
                statusDiv.style.color = 'var(--primary)';
            }
        });

        document.getElementById('btnSyncLokasi').addEventListener('click', async () => {
            const statusDiv = document.getElementById('statusLokasi');
            statusDiv.innerText = '⏳ Downloading location data...';
            statusDiv.style.color = 'var(--text-main)';
            try {
                const response = await fetch(URL_GAS_LOKASI);
                dataLokasiExcel = await response.json();
                if (!Array.isArray(dataLokasiExcel)) throw new Error("Invalid response format.");

                statusDiv.innerText = `✅ Successfully loaded ${dataLokasiExcel.length} locations!`;
                statusDiv.style.color = 'var(--secondary)'; 
                renderDataLokasi();
            } catch (error) {
                statusDiv.innerText = '❌ Failed to connect to Location Spreadsheet.';
                statusDiv.style.color = 'var(--primary)';
            }
        });

        document.getElementById('filterCariLokasi').addEventListener('input', renderDataLokasi);

        function renderDataLokasi() {
            const grid = document.getElementById('gridLokasi');
            const filter = document.getElementById('filterCariLokasi').value.toUpperCase().trim();
            grid.innerHTML = '';

            if(dataLokasiExcel.length === 0) return grid.innerHTML = '<p style="text-align:center; font-weight:800; margin-top:20px; color:var(--text-muted); grid-column: 1 / -1;">Click Download button above first.</p>';
            if(!filter) return grid.innerHTML = '<p style="text-align:center; font-weight:800; margin-top:20px; color:var(--text-muted); grid-column: 1 / -1;">Type SO number in the search box 👆</p>';

            let filtered = dataLokasiExcel.filter(d => (d.so || "").toUpperCase().includes(filter));
            if (filtered.length === 0) return grid.innerHTML = '<p style="text-align:center; font-weight:800; margin-top:20px; color:var(--primary); grid-column: 1 / -1;">❌ SO not found.</p>';

            filtered.forEach(d => {
                grid.innerHTML += `
                    <div class="lokasi-besar-card">
                        <div>
                            <div class="lbl-sm" style="color:var(--warning-text); opacity:0.8;">SALES ORDER</div>
                            <div style="font-weight: 900; font-size: 18px; color: var(--warning-text);">${d.so}</div>
                        </div>
                        <div>
                            <div class="lbl-sm" style="color:var(--warning-text); opacity:0.8;">CARTON LOCATION</div>
                            <div style="font-size: 24px; font-weight: 900; color: var(--warning-text);">📍 ${d.lokasi}</div>
                        </div>
                    </div>`;
            });
        }

        document.getElementById('btnCariListStok').addEventListener('click', async () => {
            const soTarget = document.getElementById('inputCariListStok').value.toUpperCase().trim();
            const statusDiv = document.getElementById('statusListStok');
            const summaryContainer = document.getElementById('summaryStokContainer');
            const grid = document.getElementById('gridListStok');
            
            grid.innerHTML = '';
            summaryContainer.innerHTML = '';
            
            if(!soTarget) return statusDiv.innerText = "❌ Please enter SO number.";

            statusDiv.innerText = "⏳ Searching stock & location data for SO " + soTarget + "...";
            statusDiv.style.color = "var(--text-main)";

            try {
                const responseStok = await fetch(URL_GAS_STOK + "?so=" + encodeURIComponent(soTarget));
                const data = await responseStok.json();

                if(dataLokasiExcel.length === 0) {
                    try {
                        const responseLokasi = await fetch(URL_GAS_LOKASI);
                        dataLokasiExcel = await responseLokasi.json();
                    } catch(e) {}
                }

                if(data.error) {
                    statusDiv.innerText = data.error;
                    statusDiv.style.color = "var(--primary)";
                } else if(data.length === 0) {
                    statusDiv.innerText = "❌ No marked cartons found for this SO in the Spreadsheet.";
                    statusDiv.style.color = "var(--primary)";
                } else {
                    statusDiv.innerText = `✅ Data successfully loaded. Select carton for manual input.`;
                    statusDiv.style.color = "var(--secondary)"; 
                    
                    let lokasiSO = "NOT FOUND";
                    if(Array.isArray(dataLokasiExcel) && dataLokasiExcel.length > 0) {
                        let matchLoc = dataLokasiExcel.find(l => {
                            let lSo = (l.so || "").toString().toUpperCase().trim();
                            return lSo === soTarget || lSo.includes(soTarget) || soTarget.includes(lSo);
                        });
                        if(matchLoc && matchLoc.lokasi) lokasiSO = matchLoc.lokasi;
                    }

                    data.forEach(d => { d.lokasi = lokasiSO; });
                    
                    window.lastFetchedStok = data;
                    window.selectedStokKarton.clear();
                    updateBulkStokUI();
                    
                    const firstStok = data[0] || {};
                    summaryContainer.innerHTML = `
                        <div class="summary-panel">
                            <div class="summary-top">
                                <div>
                                    <div class="summary-label">Cartons Available</div>
                                    <h2 class="summary-number">${data.length}</h2>
                                </div>
                                <div class="summary-so">SO: ${firstStok.so || soTarget}</div>
                            </div>
                            <div class="summary-meta">
                                <span>STYLE: ${firstStok.artikel || '-'}</span>
                                <span>DESTINATION: ${firstStok.destination || '-'}</span>
                                <span>PO: ${firstStok.po || '-'}</span>
                            </div>
                        </div>
                    `;
                    
                    data.forEach(d => {
                        let isChecked = window.selectedStokKarton.has(d.karton) ? 'checked' : '';
                        
                        grid.innerHTML += `
                            <div class="premium-card">
                                <div class="card-top">
                                    <div class="card-so-wrap">
                                        <input type="checkbox" class="chk-select-stok" value="${d.karton}" onchange="toggleSelectStok(this)" ${isChecked}>
                                        <span class="card-so" style="font-size:16px;">${d.so}</span>
                                    </div>
                                </div>
                                <div class="card-mid" style="justify-content:center; padding:15px;">
                                    <span class="card-size" style="font-size:24px;">${d.size}</span>
                                </div>
                                <div class="card-info-grid">
                                    <div class="info-col">
                                        <span class="lbl-sm">CTN NO.</span>
                                        <span class="val-md">${d.karton}</span>
                                    </div>
                                    <div class="info-col" style="text-align:right;">
                                        <span class="lbl-sm">LOCATION</span>
                                        <span class="val-loc">${d.lokasi}</span>
                                    </div>
                                </div>
                                <div class="card-artikel">${d.artikel}</div>
                                <div class="card-destination">🌐 ${d.destination || 'DESTINATION UNKNOWN'}</div>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                statusDiv.innerText = "❌ Failed to connect to server!";
                statusDiv.style.color = "var(--primary)";
            }
        });

        window.toggleSelectStok = (cb) => {
            cb.checked ? window.selectedStokKarton.add(cb.value) : window.selectedStokKarton.delete(cb.value);
            updateBulkStokUI();
        }

        window.updateBulkStokUI = () => {
            const bar = document.getElementById('bulkActionStokBar');
            if (window.selectedStokKarton.size > 0 && document.getElementById('tabListStok').classList.contains('active')) {
                bar.style.display = 'flex';
                document.getElementById('bulkStokCount').innerText = `${window.selectedStokKarton.size} Selected`;
            } else {
                bar.style.display = 'none';
            }
        }

        window.pindahkanKeInput = () => {
            if(window.selectedStokKarton.size === 0) return;
            let selectedData = window.lastFetchedStok.filter(d => window.selectedStokKarton.has(d.karton));
            if(selectedData.length === 0) return;

            if(window.currentEditId) batalEdit();

            document.getElementById('soInput').value = selectedData[0].so || '';
            document.getElementById('artikelInput').value = selectedData[0].artikel || '';
            if(selectedData[0].lokasi && selectedData[0].lokasi !== "NOT FOUND") {
                document.getElementById('lokasiInput').value = selectedData[0].lokasi;
            } else {
                document.getElementById('lokasiInput').value = '';
            }
            document.getElementById('ruanganInput').value = '';
            
            let isMixData = selectedData[0].size === '-' || selectedData[0].size === 'MIX';
            document.getElementById('jenisInput').value = isMixData ? 'MIX' : 'SOLID';
            
            const list = document.getElementById('kartonList');
            list.innerHTML = ''; 

            let sizeVal = isMixData ? '-' : selectedData[0].size;
            let readOnlyAttr = isMixData ? 'readonly style="background-color:var(--border);"' : '';

            selectedData.forEach(d => {
                const row = document.createElement('div');
                row.className = 'form-row karton-item';
                row.style.marginBottom = '12px';
                row.innerHTML = `
                    <input type="text" class="form-input size-input" value="${sizeVal}" placeholder="Size" ${readOnlyAttr}>
                    <input type="text" inputmode="numeric" class="form-input nokarton-input" value="${d.karton}" placeholder="Ctn No.">
                    <button class="btn-hapus-baris" onclick="this.parentElement.remove()">❌</button>
                `;
                list.appendChild(row);
            });
            
            applyUppercaseListener(); 
            applyKartonFormatListener();
            window.selectedStokKarton.clear();
            updateBulkStokUI();
            document.querySelectorAll('.chk-select-stok').forEach(cb => cb.checked = false);
            openTab('tabInput', document.getElementById('btnTabInput'));
        }

        document.getElementById('jenisInput').addEventListener('change', function() {
            let isMix = this.value === 'MIX';
            document.querySelectorAll('.size-input').forEach(input => {
                if (isMix) {
                    input.value = '-';
                    input.readOnly = true;
                    input.style.backgroundColor = 'var(--border)';
                } else {
                    if (input.value === '-' || input.value === 'MIX') input.value = '';
                    input.readOnly = false;
                    input.style.backgroundColor = '';
                }
            });
        });

        function applyUppercaseListener() {
            document.querySelectorAll('input[type="text"]').forEach(input => {
                if(!input.hasAttribute('data-upper')) {
                    input.setAttribute('data-upper', 'true');
                    input.addEventListener('input', function() { this.value = this.value.toUpperCase(); });
                }
            });
        }
        
        function applyKartonFormatListener() {
            document.querySelectorAll('.nokarton-input').forEach(input => {
                if(!input.hasAttribute('data-format')) {
                    input.setAttribute('data-format', 'true');
                    
                    input.addEventListener('input', function() { 
                        this.value = this.value.replace(/[^0-9#]/g, ''); 
                        let val = this.value.trim();
                        if(val !== '' && !val.startsWith('#')) {
                            val = '#' + val;
                        }
                        
                        if (val !== '' && typeof dataStokExcel !== 'undefined' && dataStokExcel.length > 0 && document.getElementById('jenisInput').value !== 'MIX') {
                            let match = dataStokExcel.find(d => d.karton === val);
                            if (match) {
                                let row = this.closest('.karton-item');
                                if (row) {
                                    let sizeInput = row.querySelector('.size-input');
                                    if(sizeInput && !sizeInput.readOnly) sizeInput.value = match.size;
                                }
                            }
                        }
                    });
                    
                    input.addEventListener('blur', function() {
                        let val = this.value.trim();
                        if(val !== '' && !val.startsWith('#')) {
                            this.value = '#' + val;
                        }
                    });
                }
            });
        }

        applyUppercaseListener(); applyKartonFormatListener();

        document.getElementById('btnTambahBaris').addEventListener('click', () => {
            const list = document.getElementById('kartonList');
            const row = document.createElement('div');
            row.className = 'form-row karton-item';
            row.style.marginBottom = '12px';
            
            let isMix = document.getElementById('jenisInput').value === 'MIX';
            let sizeVal = isMix ? '-' : '';
            let readOnlyAttr = isMix ? 'readonly style="background-color:var(--border);"' : '';

            row.innerHTML = `<input type="text" class="form-input size-input" placeholder="Size" value="${sizeVal}" ${readOnlyAttr}><input type="text" inputmode="numeric" class="form-input nokarton-input" placeholder="Ctn No."><button class="btn-hapus-baris" onclick="this.parentElement.remove()">❌</button>`;
            list.appendChild(row);
            applyUppercaseListener(); applyKartonFormatListener();
        });

        window.hapusBaris = (btn) => btn.parentElement.remove();

        window.batalEdit = () => {
            window.currentEditId = null; 
            window.editOldSO = null; 
            window.editOldCTN = null; 
            
            const btnTbh = document.getElementById('btnTambah');
            btnTbh.innerHTML = "Save Stock Data"; 
            document.getElementById('editActionGroup').style.display = "none";
            document.getElementById('btnTambahBaris').style.display = "block"; 
            document.getElementById('tanggalInput').valueAsDate = new Date();
            ['soInput','artikelInput','lokasiInput','keteranganInput'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('jenisInput').value = 'SOLID';

                let item = rawData.find(d => d.id === id);

        onValue(kartonRef, (snapshot) => {

                let sizeStr = (data.size || "").toString().toUpperCase();

               document.getElementById('tabRiwayat').classList.contains('active')) {

            updateBulkDeleteUI();

        window.updateBulkDeleteUI = () => {
            const bar = document.getElementById('bulkActionBar');
            const isTabAktif = document.getElementById('tabAktif').classList.contains('active');

        window.outTerpilih = async () => {
            if(confirm(`Dispatch ${window.selectedIds.size} selected cartons to history and log to Excel?`)) {
                let rekapOutPayload = [];
                let syncPayload = [];
                
                for (let id of window.selectedIds) {
                    let itemData = rawData.find(d => d.id === id);
                    if(itemData) {
                        rekapOutPayload.push({ so: itemData.so_number, ctn: itemData.nomor_karton });
                        syncPayload.push({ so: itemData.so_number, karton: itemData.nomor_karton, actionType: "CHECK" });
                    }
                    let tzoffset = (new Date()).getTimezoneOffset() * 60000;
                    let localISOTime = (new Date(Date.now() - tzoffset)).toISOString().slice(0, 10);
                    await update(ref(db, `stok_fg_wh/${id}`), { status: "OUT", tanggal_out: localISOTime, timestamp_out: serverTimestamp() });
                }
                
                if(rekapOutPayload.length > 0) {
                    updateRekapKeluar(rekapOutPayload);

        /* =========================================================================
           🚀 SISTEM RENDER DATA & LAZY LOADING (KHUSUS TAB RIWAYAT)
           ========================================================================= */
        window.infiniteScrollState = { OUT: { keys: [], groups: {}, renderedCount: 0 } };
        const BATCH_SIZE = 15; 
        window.currentSoArtikelMap = {}; 

        function groupData(dataArray) {
            let grouped = {};
            dataArray.forEach(d => {
                let so = (d.so_number || "NO SO").toUpperCase();
                let art = (d.artikel || "NO ARTICLE").toUpperCase();
                let tipe = (d.jenis || "SOLID").toUpperCase(); 
                let key = so + "|||" + art + "|||" + tipe; 
                if (!grouped[key]) grouped[key] = { so: so, art: art, tipe: tipe, items: [] };
                grouped[key].items.push(d);
            });
            return grouped;
        }

        function buildPivotHTML(groupedData, tabType) {
            let keys = Object.keys(groupedData).sort();
            if (keys.length === 0) return '<div style="text-align:center; margin-top:40px;"><span style="font-size:40px;">📭</span><p style="color:var(--text-muted); font-weight:800; margin-top:10px;">No data found.</p></div>';
            
            let currentUser = auth.currentUser ? (auth.currentUser.displayName || auth.currentUser.email) : "";
            let htmlOutput = '';
            
            keys.forEach(key => {
                let group = groupedData[key];
                let groupOwner = group.items[0].diinput_oleh || '';
                let btnHapusSO = (currentUser === groupOwner) ? `<button onclick="hapusSemuaSO(event, '${group.so}', '${tabType}')" class="btn-delete-so">🗑️ Delete</button>` : '';
                let badgeGroup = group.tipe === 'MIX' ? `<span class="badge-tipe badge-mix" style="margin-left:6px; font-size:10px;">MIX</span>` : `<span class="badge-tipe badge-solid" style="margin-left:6px; font-size:10px;">SOLID</span>`;

                htmlOutput += `
                    <div class="pivot-group-header" onclick="toggleDropdown(this)">
                        <div style="display:flex; align-items:center; gap:8px; flex: 1; overflow: hidden;">
                            <span class="toggle-icon" style="font-size:10px; color:var(--text-muted); flex-shrink: 0;">▶</span>
                            <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; display:flex; align-items:center;">
                                <span>📦</span>
                                <b style="color:var(--primary); margin-left:6px;">${group.so}</b> 
                                ${badgeGroup}
                                <span style="color:var(--text-muted); font-weight:700; margin-left:6px;">| ${group.art}</span>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; flex-shrink: 0;">
                            <span class="pivot-count">${group.items.length} Cartons</span>
                            ${btnHapusSO}
                        </div>
                    </div>
                    <div class="premium-grid" style="display: none;"> 
                `;
                
                group.items.forEach(data => {
                    let htmlKeterangan = data.keterangan ? `<div class="ket-text">📝 ${data.keterangan}</div>` : '';
                    let badgeJenis = data.jenis === 'MIX' ? `<span class="badge-tipe badge-mix">MIX</span>` : `<span class="badge-tipe badge-solid">SOLID</span>`;
                    let isChecked = window.selectedIds.has(data.id) ? 'checked' : '';
                    let isMultiArtikel = tabType === 'AKTIF' && window.currentSoArtikelMap[group.so] && window.currentSoArtikelMap[group.so].size > 1;
                    let htmlPeringatanMulti = isMultiArtikel ? `<div class="alert-multi">SAME SO BUT DIFFERENT ARTICLES!</div>` : '';
                    let isOwner = (data.diinput_oleh === currentUser);

                    let visualTglMasuk = data.tanggal || '-';
                    if (visualTglMasuk !== '-') {
                        const mapBulan = { "January":"1", "February":"2", "March":"3", "April":"4", "May":"5", "June":"6", "July":"7", "August":"8", "September":"9", "October":"10", "November":"11", "December":"12" };
                        let splitTgl = visualTglMasuk.split(' ');
                        if (splitTgl.length === 3) {
                            let hari = splitTgl[0];
                            let bulanAngka = mapBulan[splitTgl[1]] || splitTgl[1];
                            let tahun = splitTgl[2];
                            visualTglMasuk = `${hari}/${bulanAngka}/${tahun}`;
                        }
                    }

                    let tglKeluarHtml = '';
                    if (tabType === 'OUT') {
                        let tglKeluar = data.tanggal_out;
                        if (tglKeluar && tglKeluar.includes('-')) {
                            let [y, m, d] = tglKeluar.split('-');
                            tglKeluar = new Date(y, m-1, d).toLocaleDateString('en-GB');
                        }
                        tglKeluarHtml = `<span class="card-date" style="color:var(--danger-text); font-weight:900;">OUT : ${tglKeluar}</span>`;
                    }

                    let actionHtml = '';
                    if (tabType === 'AKTIF') {
                        let btnEditHtml = isOwner ? `<button class="btn-edit" onclick="editSemuanya('${data.id}')">EDIT</button>` : '';
                        actionHtml = `
                            <div class="action-row">
                                ${btnEditHtml}
                                <button class="btn-out" onclick="pindahKeRiwayat('${data.id}')">DISPATCH</button>
                            </div>`;
                    }

                    let chkHtml = `<input type="checkbox" class="chk-select" value="${data.id}" onchange="toggleSelect(this)" ${isChecked}>`;

                    htmlOutput += `
                        <div class="premium-card">
                            ${htmlPeringatanMulti}
                            <div class="card-top">
                                <div class="card-so-wrap">
                                    ${chkHtml}
                                    <span class="card-so">${data.so_number}</span>
                                </div>
                                ${badgeJenis}
                            </div>
                            <div class="card-mid">
                                <span class="card-size">${data.size}</span>
                                ${tglKeluarHtml}
                            </div>
                            <div class="card-info-grid" style="margin-bottom: 10px;">
                                <div class="info-col">
                                    <span class="lbl-sm">CTN NO.</span>
                                    <span class="val-md">${data.nomor_karton}</span>
                                </div>
                                <div class="info-col" style="text-align: right;">
                                    <span class="lbl-sm">LOCATION</span>
                                    <span class="val-loc">${data.lokasi}</span>
                                </div>
                            </div>
                            <div class="card-info-grid" style="grid-template-columns: 1fr 1fr 1.5fr; margin-bottom: 14px; background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px dashed var(--border);">
                                <div class="info-col">
                                    <span class="lbl-sm">TYPE</span>
                                    <span class="val-md" style="font-size: 11px;">${data.jenis || 'SOLID'}</span>
                                </div>
                                <div class="info-col" style="text-align: center;">
                                    <span class="lbl-sm">ROOM</span>
                                    <span class="val-md" style="font-size: 11px;">${data.ruangan || '-'}</span>
                                </div>
                                <div class="info-col" style="text-align: right;">
                                    <span class="lbl-sm">DATE IN</span>
                                    <span class="val-md" style="font-size: 11px;">${visualTglMasuk}</span>
                                </div>
                            </div>
                            <div class="card-artikel">${data.artikel}</div>
                            ${data.destination ? `<div class="card-destination">🌐 ${data.destination}</div>` : ''}
                            ${htmlKeterangan}
                            <div class="card-footer">
                                <span class="card-user">By : ${data.diinput_oleh || 'System'}</span>
                            </div>
                            ${actionHtml}
                        </div>
                    `;
                });
                htmlOutput += `</div>`; 
            });
            return htmlOutput;
        }

        function renderData() {
            const fAktif = document.getElementById('filterSOAktif').value.toUpperCase().trim();
            const fRiwayat = document.getElementById('filterSORiwayat').value.toUpperCase().trim();
            const fTglRiwayatInput = document.getElementById('filterTanggalRiwayat').value;
            
            let dataAktif = rawData.filter(d => {
                if (d.status !== "AKTIF") return false;
                if (!fAktif) return true;
                return (d.so_number || "").toUpperCase().includes(fAktif) || 
                       (d.artikel || "").toUpperCase().includes(fAktif) || 
                       (d.diinput_oleh || "").toUpperCase().includes(fAktif) || 
                       (d.keterangan || "").toUpperCase().includes(fAktif);
            });

            let dataOut = rawData.filter(d => {
                if (d.status !== "OUT") return false;
                let tglLokal = "";
                if (d.tanggal_out) {
                    let [y, m, day] = d.tanggal_out.split('-');
                    if (y && m && day) tglLokal = new Date(y, m-1, day).toLocaleDateString('en-GB').toUpperCase();
                }
                let matchText = true;
                if(fRiwayat) {
                    matchText = (d.so_number || "").toUpperCase().includes(fRiwayat) || 
                                (d.artikel || "").toUpperCase().includes(fRiwayat) || 
                                (d.diinput_oleh || "").toUpperCase().includes(fRiwayat) || 
                                (d.keterangan || "").toUpperCase().includes(fRiwayat) || 
                                tglLokal.includes(fRiwayat); 
                }
                let matchKalender = true;
                if(fTglRiwayatInput) matchKalender = (d.tanggal_out === fTglRiwayatInput);
                return matchText && matchKalender; 
            });

            window.currentSoArtikelMap = {};
            rawData.filter(d => d.status === "AKTIF").forEach(d => {
                let so = (d.so_number || "").toUpperCase(), art = (d.artikel || "").toUpperCase();
                if (!window.currentSoArtikelMap[so]) window.currentSoArtikelMap[so] = new Set();
                if (art) window.currentSoArtikelMap[so].add(art);
            });

            const sorter = (a, b) => {
                let soA = (a.so_number || "").toString();
                let soB = (b.so_number || "").toString();
                if (soA !== soB) return soA.localeCompare(soB);
                if (a.sizeValue !== b.sizeValue) return (a.sizeValue || 0) - (b.sizeValue || 0);
                let kA = (a.nomor_karton || "").toString();
                let kB = (b.nomor_karton || "").toString();
                return kA.localeCompare(kB);
            };
            
            dataAktif.sort(sorter); 
            dataOut.sort(sorter);

            let groupedAktif = groupData(dataAktif);
            document.getElementById('gridKartonAktif').innerHTML = buildPivotHTML(groupedAktif, 'AKTIF');

            let groupedOut = groupData(dataOut);
            window.infiniteScrollState.OUT.groups = groupedOut;
            window.infiniteScrollState.OUT.keys = Object.keys(groupedOut).sort();
            window.infiniteScrollState.OUT.renderedCount = 0;
            document.getElementById('gridRiwayatOut').innerHTML = ''; 
            renderNextBatch('OUT');
            
            updateBulkDeleteUI();
        }

        let isRendering = false;
        window.renderNextBatch = (tabType) => {
            if (isRendering) return;
            isRendering = true;

            let state = window.infiniteScrollState[tabType];
            
            if (state.renderedCount >= state.keys.length) {
                isRendering = false;
                return;
            }

            if (state.keys.length === 0) {
                document.getElementById('gridRiwayatOut').innerHTML = '<div style="text-align:center; margin-top:40px;"><span style="font-size:40px;">📭</span><p style="color:var(--text-muted); font-weight:800; margin-top:10px;">No data found.</p></div>';
                isRendering = false;
                return;
            }

            let currentUser = auth.currentUser ? (auth.currentUser.displayName || auth.currentUser.email) : "";
            let htmlOutput = '';
            let startIdx = state.renderedCount;
            let endIdx = Math.min(startIdx + BATCH_SIZE, state.keys.length);

            for (let i = startIdx; i < endIdx; i++) {
                let key = state.keys[i];
                let group = state.groups[key];
                
                let groupOwner = group.items[0].diinput_oleh || '';
                let btnHapusSO = (currentUser === groupOwner) ? `<button onclick="hapusSemuaSO(event, '${group.so}', '${tabType}')" class="btn-delete-so">🗑️ Delete</button>` : '';
                let badgeGroup = group.tipe === 'MIX' ? `<span class="badge-tipe badge-mix" style="margin-left:6px; font-size:10px;">MIX</span>` : `<span class="badge-tipe badge-solid" style="margin-left:6px; font-size:10px;">SOLID</span>`;

                htmlOutput += `
                    <div class="pivot-group-header" onclick="toggleDropdown(this)">
                        <div style="display:flex; align-items:center; gap:8px; flex: 1; overflow: hidden;">
                            <span class="toggle-icon" style="font-size:10px; color:var(--text-muted); flex-shrink: 0;">▶</span>
                            <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; display:flex; align-items:center;">
                                <span>📦</span>
                                <b style="color:var(--primary); margin-left:6px;">${group.so}</b> 
                                ${badgeGroup}
                                <span style="color:var(--text-muted); font-weight:700; margin-left:6px;">| ${group.art}</span>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; flex-shrink: 0;">
                            <span class="pivot-count">${group.items.length} Cartons</span>
                            ${btnHapusSO}
                        </div>
                    </div>
                    <div class="premium-grid" style="display: none;">
                `;
                
                group.items.forEach(data => {
                    let htmlKeterangan = data.keterangan ? `<div class="ket-text">📝 ${data.keterangan}</div>` : '';
                    let badgeJenis = data.jenis === 'MIX' ? `<span class="badge-tipe badge-mix">MIX</span>` : `<span class="badge-tipe badge-solid">SOLID</span>`;
                    let isChecked = window.selectedIds.has(data.id) ? 'checked' : '';
                    let isOwner = (data.diinput_oleh === currentUser);

                    let visualTglMasuk = data.tanggal || '-';
                    if (visualTglMasuk !== '-') {
                        const mapBulan = { "January":"1", "February":"2", "March":"3", "April":"4", "May":"5", "June":"6", "July":"7", "August":"8", "September":"9", "October":"10", "November":"11", "December":"12" };
                        let splitTgl = visualTglMasuk.split(' ');
                        if (splitTgl.length === 3) {
                            let hari = splitTgl[0];
                            let bulanAngka = mapBulan[splitTgl[1]] || splitTgl[1];
                            let tahun = splitTgl[2];
                            visualTglMasuk = `${hari}/${bulanAngka}/${tahun}`;
                        }
                    }

                    let tglKeluarHtml = '';
                    if (tabType === 'OUT') {
                        let tglKeluar = data.tanggal_out;
                        if (tglKeluar && tglKeluar.includes('-')) {
                            let [y, m, d] = tglKeluar.split('-');
                            tglKeluar = new Date(y, m-1, d).toLocaleDateString('en-GB');
                        }
                        tglKeluarHtml = `<span class="card-date" style="color:var(--danger-text); font-weight:900;">OUT : ${tglKeluar}</span>`;
                    }

                    let chkHtml = `<input type="checkbox" class="chk-select" value="${data.id}" onchange="toggleSelect(this)" ${isChecked}>`;

                    htmlOutput += `
                        <div class="premium-card">
                            <div class="card-top">
                                <div class="card-so-wrap">
                                    ${chkHtml}
                                    <span class="card-so">${data.so_number}</span>
                                </div>
                                ${badgeJenis}
                            </div>
                            <div class="card-mid">
                                <span class="card-size">${data.size}</span>
                                ${tglKeluarHtml}
                            </div>
                            <div class="card-info-grid" style="margin-bottom: 10px;">
                                <div class="info-col">
                                    <span class="lbl-sm">CTN NO.</span>
                                    <span class="val-md">${data.nomor_karton}</span>
                                </div>
                                <div class="info-col" style="text-align: right;">
                                    <span class="lbl-sm">LOCATION</span>
                                    <span class="val-loc">${data.lokasi}</span>
                                </div>
                            </div>
                            <div class="card-info-grid" style="grid-template-columns: 1fr 1fr 1.5fr; margin-bottom: 14px; background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px dashed var(--border);">
                                <div class="info-col">
                                    <span class="lbl-sm">TYPE</span>
                                    <span class="val-md" style="font-size: 11px;">${data.jenis || 'SOLID'}</span>
                                </div>
                                <div class="info-col" style="text-align: center;">
                                    <span class="lbl-sm">ROOM</span>
                                    <span class="val-md" style="font-size: 11px;">${data.ruangan || '-'}</span>
                                </div>
                                <div class="info-col" style="text-align: right;">
                                    <span class="lbl-sm">DATE IN</span>
                                    <span class="val-md" style="font-size: 11px;">${visualTglMasuk}</span>
                                </div>
                            </div>
                            <div class="card-artikel">${data.artikel}</div>
                            ${data.destination ? `<div class="card-destination">🌐 ${data.destination}</div>` : ''}
                            ${htmlKeterangan}
                            <div class="card-footer">
                                <span class="card-user">By : ${data.diinput_oleh || 'System'}</span>
                            </div>
                        </div>
                    `;
                });
                htmlOutput += `</div>`; 
            }

            document.getElementById('gridRiwayatOut').insertAdjacentHTML('beforeend', htmlOutput);
            state.renderedCount = endIdx;
            isRendering = false;
            
            if (document.documentElement.scrollHeight <= window.innerHeight + 50 && state.renderedCount < state.keys.length) {
                setTimeout(() => renderNextBatch(tabType), 50);
            }
        }

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 150) {
                if (document.getElementById('tabRiwayat').classList.contains('active')) {
                    renderNextBatch('OUT');
                }
            }
        });

        document.getElementById('filterSOAktif').addEventListener('input', renderData);
        document.getElementById('filterSORiwayat').addEventListener('input', renderData);
        document.getElementById('filterTanggalRiwayat').addEventListener('input', renderData);

        window.pindahKeRiwayat = async (id) => {
            if(confirm("Dispatch this item (OUT) and log to Excel?")) {
                let itemData = rawData.find(d => d.id === id);
                if(itemData) {
                    updateRekapKeluar([{ so: itemData.so_number, ctn: itemData.nomor_karton }]);
                    
                    let syncPayload = [{ so: itemData.so_number, karton: itemData.nomor_karton, actionType: "CHECK" }];
                    let fetchUrl = URL_GAS_STOK + "?action=sync&payload=" + encodeURIComponent(JSON.stringify(syncPayload));
                    fetch(fetchUrl, { mode: "no-cors" }).catch(e => console.log(e));
                }
                let tzoffset = (new Date()).getTimezoneOffset() * 60000;
                let localISOTime = (new Date(Date.now() - tzoffset)).toISOString().slice(0, 10);
                await update(ref(db, `stok_fg_wh/${id}`), { status: "OUT", tanggal_out: localISOTime, timestamp_out: serverTimestamp() }); 
            }
        };
    </script>
</body>
</html>
